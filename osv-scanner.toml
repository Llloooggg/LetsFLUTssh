# osv-scanner suppressions — one entry per upstream-unfixed advisory.
# Each entry MUST carry a real rationale and a re-evaluation trigger
# (date or "when upstream ships fix"). Empty `reason` is forbidden.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
# Marvin timing attack against `rsa` (RustCrypto): variable-time RSA
# private-key operations leak, across enough adaptively-timed samples,
# enough to recover the key. No fixed `rsa` release on crates.io as of
# 2026-06; tracked at https://github.com/RustCrypto/RSA/issues/19.
#
# Why no online private-key operation reaches the vulnerable crate:
#   - The exploitable Marvin primitive is the PKCS#1 v1.5 *decryption*
#     padding oracle. This SSH client performs no RSA decryption:
#     russh offers only curve25519 / ecdh-nistp key exchange (no RSA
#     key transport), so that vector is structurally absent.
#   - RSA *signing* (the one online private-key op an SSH client does)
#     is routed off the `rsa` crate: software keys sign through ring
#     (constant-time — `ssh::software_rsa_signer`), and hardware keys
#     sign in the TPM / Secure Enclave / Keystore / PKCS#11 backend.
#     The `rsa` crate is reached only OFFLINE — parsing a key and
#     re-encoding its components to PKCS#8 for ring — which runs no
#     private-key modexp and presents no network-observable oracle.
#   - RSA *verification* uses the server's public key — no secret, no
#     leak — and stays on the `rsa` crate harmlessly.
#   - The crate cannot be dropped: ssh-key / russh require it for RSA
#     key types and host-key verification. Ed25519 is the wizard
#     default regardless.
#
# Re-evaluate when RustCrypto/RSA ships a constant-time release.
reason = "Marvin timing attack in `rsa` crate — no upstream fix. The exploitable primitive (PKCS#1 v1.5 decryption oracle) is structurally absent: this SSH client does no RSA decryption (russh KEX is curve25519/ecdh-nistp only). The one online RSA private-key op — signing — is routed off the crate: software keys sign via ring (constant-time, ssh::software_rsa_signer), hardware keys via TPM/SE/Keystore/PKCS#11. The `rsa` crate is reached only offline (key parsing / PKCS#8 re-encode, no modexp) and for public-key verification. It cannot be dropped (ssh-key/russh need it for RSA types + host-key verify). Re-evaluate when RustCrypto/RSA ships a fix."
