# Minimal httpd.conf for a WebDAV server with Digest (MD5) auth.
# The realm string must match exactly the one used at htdigest time
# in the Dockerfile — Digest hashes depend on realm.
#
# Mirrors the RFC-7616 challenge / response path the app's
# `webdav::auth::DigestChallenge` parser handles. `qop=auth` and
# `algorithm=MD5` match what the client supports.

ServerRoot /usr/local/apache2
Listen 80
ServerName localhost

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule authn_core_module     modules/mod_authn_core.so
LoadModule authn_file_module     modules/mod_authn_file.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule authz_user_module     modules/mod_authz_user.so
LoadModule auth_digest_module    modules/mod_auth_digest.so
LoadModule dav_module            modules/mod_dav.so
LoadModule dav_fs_module         modules/mod_dav_fs.so
LoadModule alias_module          modules/mod_alias.so
LoadModule dir_module            modules/mod_dir.so
LoadModule mime_module           modules/mod_mime.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule headers_module        modules/mod_headers.so
LoadModule setenvif_module       modules/mod_setenvif.so

User  daemon
Group daemon

TypesConfig conf/mime.types
DefaultRuntimeDir /usr/local/apache2/logs

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

DAVLockDB /var/dav-lock/locks

Alias /dav /var/dav

<Directory /var/dav>
    Dav On
    AuthType Digest
    AuthName "LetsFLUTssh dev WebDAV (Digest)"
    AuthDigestAlgorithm MD5
    AuthDigestQop auth
    AuthDigestProvider file
    AuthUserFile /usr/local/apache2/conf/users.htdigest
    Require valid-user
</Directory>
