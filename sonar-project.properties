sonar.projectKey=Llloooggg_LetsFLUTssh
sonar.organization=llloooggg
# Source roots cover both backends — Dart UI/state under `lib/`
# and the Rust security/transport core under `rust/crates/`.
# Test roots: Dart tests under `test/`, Rust integration tests
# under `rust/crates/*/tests/` (Cargo's convention for separate
# test binaries). Rust unit tests live as inline
# `#[cfg(test)] mod tests` blocks at the bottom of source files;
# Sonar can't classify those into a separate "test code" bucket
# without a Cargo-aware analyzer, so they stay scanned as
# source. Coverage still counts them via the lcov report.
sonar.sources=lib,rust/crates
sonar.tests=test,rust/crates
sonar.test.inclusions=**/*_test.dart,**/tests/**
sonar.sourceEncoding=UTF-8
# Generated code + localisations: excluded from both the source
# scan (SonarCloud would flag auto-generated "code smells") AND
# from coverage math (denominator would be dominated by 11 K l10n
# lines + 3 K drift generator output that no test can reasonably
# hit). FRB-generated `lib/src/rust/` is excluded too — it mirrors
# the real Rust source under `rust/crates/`, so counting it would
# double-charge the same logic. `rust/target/` is the cargo build
# output dir, never source.
sonar.exclusions=lib/l10n/**,**/*.g.dart,**/*.freezed.dart,lib/src/rust/**,rust/target/**
sonar.coverage.exclusions=lib/l10n/**,**/*.g.dart,**/*.freezed.dart,lib/src/rust/**
sonar.dart.lcov.reportPaths=coverage/lcov.info
# SonarCloud's community Rust analyzer consumes the `rust-lcov.info`
# file produced by `cargo llvm-cov` in the rust-ci job — downloaded
# in ci-sonarcloud.yml from the rust-coverage artifact. Both Dart
# and Rust coverage land in the same project's quality dashboard.
sonar.community.rust.lcov.reportPaths=rust-lcov.info

# False-positive suppressions, mirroring the osv-scanner.toml policy:
# one entry per genuine FP with a rationale and a re-evaluation trigger.
#
# secrets:S6706 / S6693 on the key-handling files — `keys.rs` and
#   `openssh_config.rs` hold PEM *format markers*
#   (`pem.contains("-----BEGIN … PRIVATE KEY-----")` for type detection)
#   and throwaway sample PEM test vectors in their inline `#[cfg(test)]`
#   blocks. Neither is a real credential; the secrets regex can't tell a
#   header pattern / sample from a leaked key. Re-evaluate if a real key
#   ever needs to live in one of these files (it must not).
# text:S8570 on Cargo.toml — fires "versions unpredictable if Cargo.lock
#   is missing", but this is a Cargo *workspace*: the single committed
#   lock is rust/Cargo.lock (workspaces have no per-crate lock). FP.
# dart:S5324 on local_fs.dart — `getExternalStorageDirectory()` returns
#   the app's own scoped dir (Android/data/<pkg>/files), not the
#   world-readable shared storage the rule warns about.
# dart:S2260 flags `{this._field}` private-named initializing formals as
# requiring an "experimental" language feature. It is stable in Dart 3.12
# (the SDK Flutter 3.44 ships): the code analyzes/compiles/tests clean
# with no `enable-experiment` in analysis_options. Stale Sonar rule.
sonar.issue.ignore.multicriteria=sec1,sec2,sec3,sec4,lock1,ext1,s2260
sonar.issue.ignore.multicriteria.s2260.ruleKey=dart:S2260
sonar.issue.ignore.multicriteria.s2260.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.sec1.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.sec1.resourceKey=**/keys.rs
sonar.issue.ignore.multicriteria.sec2.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.sec2.resourceKey=**/openssh_config.rs
sonar.issue.ignore.multicriteria.sec3.ruleKey=secrets:S6693
sonar.issue.ignore.multicriteria.sec3.resourceKey=**/keys.rs
sonar.issue.ignore.multicriteria.sec4.ruleKey=secrets:S6693
sonar.issue.ignore.multicriteria.sec4.resourceKey=**/openssh_config.rs
sonar.issue.ignore.multicriteria.lock1.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.lock1.resourceKey=**/Cargo.toml
sonar.issue.ignore.multicriteria.ext1.ruleKey=dart:S5324
sonar.issue.ignore.multicriteria.ext1.resourceKey=**/local_fs.dart
