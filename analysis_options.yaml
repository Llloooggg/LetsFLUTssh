include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Strict casts — every implicit `dynamic → T` cast lights up
    # as an error. The single most impactful strict knob; rejects
    # the silent-`dynamic`-pipeline class the audit flagged
    # without inflating the warning count from existing implicit-
    # generic call sites the way strict-inference / strict-raw-
    # types would.
    strict-casts: true
  errors:
    missing_return: error
    dead_code: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # FRB codegen — auto-generated Dart bindings carry the same
    # implicit-generics shape `flutter_rust_bridge_codegen` emits;
    # editing them directly is forbidden (re-generated by `make
    # rust-codegen`).
    - "lib/src/rust/**"
    # Vendored cargokit subtree. It's a separate Dart package with
    # its own `pubspec.yaml` / `analysis_options.yaml` and is built
    # via Gradle/CMake at release time, not via `flutter analyze` at
    # PR time. CI doesn't run `dart pub get` inside it, so its deps
    # (ed25519_edwards, github, hex, toml, version) are unresolved
    # and analyzer would emit ~50 `uri_does_not_exist` errors that
    # don't reflect real breakage. Excluding here keeps top-level
    # `flutter analyze --fatal-infos` clean while preserving the
    # subtree's own analyzer config when it's invoked directly.
    - "rust_builder/**"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - use_key_in_widget_constructors
    - avoid_print
    - prefer_relative_imports
