[package]
name = "lfs_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Pure-Rust headless library — consumed by frontend adapters
# (`lfs_frb`, future `lfs_tauri`, `lfs_cli`). No cdylib here: only the
# adapter crate produces the native blob loaded by the host runtime.
crate-type = ["rlib"]

[dependencies]
# OS-bound abstractions — keychain (libsecret/SecItem/CredMan/AndroidKeyStore),
# biometric backends (LAContext/UserConsentVerifier/BiometricPrompt/fprintd),
# clipboard, session lock. lfs_core orchestrators call these directly so the
# Rust security stack composes end-to-end without bouncing through Dart bus
# subscribers. Stays a one-way edge: lfs_os_security never depends on lfs_core
# (its `unsafe_code = "forbid"` boundary lives downstream).
lfs_os_security = { path = "../lfs_os_security" }
russh = { workspace = true }
# Direct dep solely to enable the `ppk` feature on the forked
# ssh-key crate that russh pulls transitively. See workspace
# Cargo.toml note for the version-pin rationale. Cargo-machete
# flags this as unused because there is no `use` statement; the
# feature-flag activation is the real reason it's here, hence the
# entry in `[package.metadata.cargo-machete] ignored = ...` below.
internal-russh-forked-ssh-key = { workspace = true }
russh-sftp = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-channel = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
# Used by `keys::generate_*` for keypair RNG. Kept on rand 0.8 to
# match the trait bound on russh-keys 0.6.16's `PrivateKey::random`.
rand = "0.8"
# Phase 2 crypto envelopes — HKDF-SHA-256 + Ed25519 verify in
# `lfs_core::crypto`. Replaces pointycastle / pinenacl on the Dart
# side once the call sites flip.
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
# HTTP fetch for `lfs_core::update_http` — the auto-update
# channel's manifest + asset download path. Kept on rustls-tls
# so the dep tree stays pure-Rust (no openssl system link).
reqwest = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }

# Linux-only D-Bus client for the fprintd shim under
# `platform::linux::fprintd`. The TSS2 ESAPI binding (`tss-esapi`)
# moved into `lfs_os_security::linux::tpm` so the OS-FFI
# perimeter stays single-edge — `lfs_core` reaches the TPM
# orchestrator through that crate.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
serde = { workspace = true }

# Unix-only syscall constants (`O_NOFOLLOW`, `O_EXCL`) for the
# symlink-defended read / write helpers in `lfs_core::path`.
# Pulled cfg(unix) so Windows builds skip the dep entirely.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# Hardening: deny `unsafe` blocks at the lfs_core level. Transitive
# crates (russh, tokio, ring, ...) still use `unsafe` internally —
# that's their audit perimeter, not ours. This pins the rule on
# anything WE write here.
[lints.rust]
unsafe_code = "forbid"

[package.metadata.cargo-machete]
# `internal-russh-forked-ssh-key` is feature-only — we depend on it
# to flip the `ppk` feature flag on the forked ssh-key russh pulls
# transitively, with no `use` statement of our own. Cargo-machete
# would otherwise flag it as unused on every run.
ignored = ["internal-russh-forked-ssh-key"]
