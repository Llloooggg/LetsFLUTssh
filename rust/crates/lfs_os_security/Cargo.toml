[package]
name = "lfs_os_security"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

# Process-hardening + memory-lock helpers. Per-OS FFI lives here
# (not in lfs_core) so the core stays `unsafe_code = "forbid"`. This
# crate's surface is a small set of safe-to-call functions —
# `apply_startup_hardening()`, `lock_memory(addr, len)`,
# `unlock_memory(addr, len)`. The unsafe blocks are auditable
# in one place.

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = { version = "0.2", default-features = false }

# Linux-only deps:
#   - `arboard` for the desktop clipboard write (X11 + Wayland;
#     no cloud-clipboard concern, per-platform sensitive flag is
#     a no-op here).
#   - `zbus` + `futures-util` + `tokio` for the logind session-
#     lock subscription. zbus is the workspace-shared crate; the
#     duplicate target table keeps the cfg gate explicit.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false }
zbus = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }

# Apple-only deps for `backup_exclusion` (NSURL.setResourceValues:
# isExcludedFromBackup) and `secure_clipboard` (NSPasteboard /
# UIPasteboard). Cfg-gated so Linux / Windows builds skip the
# whole objc2 crate tree.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError", "NSValue", "NSNotification", "NSData", "NSArray", "NSDictionary"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = ["UIPasteboard"] }

# Lints — allow unsafe for the FFI shims, deny everything else.
[lints.rust]
unsafe_code = "allow"
