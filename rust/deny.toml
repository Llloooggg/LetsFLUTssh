# cargo-deny config — runs in CI (`.github/workflows/ci.yml::rust-ci`).
#
# Three gates:
#   1. advisories — no known-CVE crates in the dep tree
#   2. licenses   — every transitive license is on the allow-list
#   3. bans       — duplicate versions warn (catches near-duplicates),
#                   wildcard requirements deny (forbids `crate = "*"`)
#
# When this fails in CI, fix the root cause — never blanket-allow new
# licenses or ignore an advisory without writing the rationale right
# next to the entry.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071: Marvin Attack timing sidechannel in
  # `rsa` 0.10.0-rc.12 (pulled transitively by russh-keys' RSA
  # support). The advisory states "No safe upgrade is available" —
  # upstream RustCrypto/RSA is migrating to a constant-time impl
  # but no fixed version is published yet.
  #
  # Threat model in our context:
  #   - Vulnerability is exploitable only by an attacker who can
  #     observe SSH RSA signing timing over the network. Local /
  #     LAN attacker scenario.
  #   - Affects RSA keys only. Ed25519 and ECDSA keys go through
  #     other crates (curve25519-dalek, ecdsa) and are unaffected.
  #   - Users are guided towards Ed25519 in the key-generation UI.
  #
  # Mitigation: track the upstream RustCrypto/RSA constant-time
  # milestone (https://github.com/RustCrypto/RSA/issues/626) and
  # drop this allow when it lands.
  #
  # Re-review by 2026-12-31. cargo-deny 0.19 does not support a
  # native `expiration` field, so the date lives in this comment
  # and the `reason:` string. If the upstream RustCrypto/RSA fix
  # is still pending past that date, update the date with a
  # fresh look at the threat model — never silently extend
  # without re-reviewing.
  { id = "RUSTSEC-2023-0071", reason = "marvin-attack-rsa-no-fix-yet (re-review by 2026-12-31)" },
]

[licenses]
# Anything not on this list fails the build. Add new entries only
# after a license review, not just because cargo-deny complained.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  # GPL-3.0-only — the project's own license, applies to lfs_fuzz
  # which intentionally inherits it (fuzz harnesses ship under the
  # same GPL terms as the rest of the repo).
  "GPL-3.0-only",
  # NCSA (University of Illinois / NCSA Open Source License) — OSI-
  # approved, FSF-free, permissive (MIT-style). Carried by
  # libfuzzer-sys, used only by the lfs_fuzz harnesses (not in the
  # shipped binary).
  "NCSA",
  # Boost Software License 1.0 — permissive (no copyleft, no
  # attribution-in-binary requirement, OSI/FSF-approved). Carried
  # by `clipboard-win` + `error-code` (DoumanAsh), pulled
  # transitively via `arboard` for the Windows clipboard backend
  # in `lfs_os_security::secure_clipboard`. Reviewed: terms are
  # broadly equivalent to MIT — copyright notice must remain in
  # the source distribution, no further obligations on binary
  # redistribution.
  "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Add specific banned crates here as we identify them.
]
skip = [
  # Some duplicate transitive versions are unavoidable; pin them
  # here with a comment when justified. Empty for now.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
