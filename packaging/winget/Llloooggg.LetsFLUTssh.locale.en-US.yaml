ShortDescription: Lightweight cross-platform SSH/SFTP client.
Description: |-
  LetsFLUTssh is a full-featured SSH terminal and SFTP file
  browser with session management, encrypted credential storage
  (AES-GCM with Argon2id KDF, optional TPM2 / Secure Enclave /
  TPM-backed Windows Hello binding), and tiling terminal layout.
  Open-source alternative to Xshell / Termius. Backed by russh
  (pure-Rust SSH transport) — no OpenSSH-shell-out, no historical
  CVE pattern.
Tags:
