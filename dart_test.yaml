# Test-runner configuration.
#
# `frb_global_store` marks the test files that destructively clear the
# process-global `lfs_core::secrets::SecretStore` — the `evictAll` /
# setUp clears in `session_credential_cache_test` and the `wipeAll`
# sweep in `wipe_all_service_test`. `flutter test` runs files in
# parallel isolates that share one Rust process (hence one global
# store), and these can't even share a process serially (an async
# clear from one crosses the suite boundary into another's
# assertions). The `dart-test` Makefile target excludes the tag from
# its parallel main pass, then runs each tagged file in its OWN
# `flutter test` process (fresh Rust AppState). Declared here so
# `--tags` / `--exclude-tags` don't warn about an unknown tag.
tags:
  frb_global_store:
