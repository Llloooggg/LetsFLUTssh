# Test-runner configuration.
#
# `frb_global_store` marks test files that destructively mutate
# process-global Rust state — either the `lfs_core::secrets::SecretStore`
# (the `evictAll` / setUp clears in `session_credential_cache_test`, the
# `wipeAll` sweep in `wipe_all_service_test`) or the in-memory DB behind
# the one shared `AppState` (the wipe-and-assert-exact-snapshot flows in
# `session_workspace_db_test` and `known_hosts_db_test`). `flutter test`
# runs files in parallel
# isolates that share one Rust process (hence one global store and one
# DB), so a file that clears the store or asserts the exact session set
# would see another isolate's rows. They can't even share a process
# serially (an async clear from one crosses the suite boundary into
# another's assertions). The `dart-test` Makefile target excludes the
# tag from its parallel main pass, then runs each tagged file in its OWN
# `flutter test` process (fresh Rust AppState). Declared here so
# `--tags` / `--exclude-tags` don't warn about an unknown tag.
tags:
  frb_global_store:
