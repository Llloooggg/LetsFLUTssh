name: letsflutssh
description: Cross-platform SSH/SFTP client with GUI
publish_to: 'none'
version: 8.4.2+429
homepage: https://github.com/Llloooggg/LetsFLUTssh
repository: https://github.com/Llloooggg/LetsFLUTssh
issue_tracker: https://github.com/Llloooggg/LetsFLUTssh/issues
documentation: https://github.com/Llloooggg/LetsFLUTssh/tree/main/docs

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # FFI bridge to the Rust core (see rust/, ARCHITECTURE.md §3.14).
  # `lfs_core` + `lfs_frb` is the only SSH/SFTP/key engine. Pin must
  # match the codegen CLI version (`cargo install
  # flutter_rust_bridge_codegen --version 2.12.0`) exactly — drift
  # produces incompatible bindings.
  flutter_rust_bridge: 2.12.0

  # Annotations for the Freezed sealed-class codegen used by FRB on
  # the Dart side. Needs to be a direct (non-dev) dep because the
  # generated `*.freezed.dart` files import these annotations and
  # ship in the release build.
  freezed_annotation: ^3.1.0

  # State management
  flutter_riverpod: ^3.3.2

  # File system paths
  path_provider: ^2.1.5

  # Utilities
  uuid: ^4.5.1
  path: ^1.9.1

  # OS drag&drop into app (desktop)
  desktop_drop: ^0.7.1


  # Foreground service (keeps SSH alive on Android screen lock)
  flutter_foreground_task: ^9.2.2

  # Deep links / file open intents
  app_links: ^7.1.2
  qr_flutter: ^4.1.0
  file_picker: ^12.0.0-beta.7
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # `@visibleForTesting` / `@protected` annotations without
  # pulling in `package:flutter/foundation`. The annotations are
  # what core/ files actually wanted; `foundation` brings the
  # whole Flutter framework along the way which violates the
  # core/-no-Flutter layering invariant.
  meta: ^1.18.0

  lfs_frb:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.0
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter
  # Freezed sealed-class codegen — flutter_rust_bridge generates Dart
  # enum bindings as Freezed sealed classes, which need the codegen
  # run after every FRB regen (`make rust-codegen` then `make gen`).
  freezed: ^3.2.0

  # SHA-256 / HMAC digest helper. Used by tests as a host-side oracle
  # to cross-check the canonical Rust digests in
  # `lfs_core::crypto`. Production paths route through the FRB
  # `cryptoSha256` / `cryptoHmacSha256` shims and never import this.
  crypto: ^3.0.5

dependency_overrides:
  # Hold path_provider_android in the 2.2.x line. 2.3.0 switched its
  # implementation to `package:jni`, which is an `ffiPlugin` declaring
  # linux + windows targets. Because the federated `path_provider`
  # pulls every platform implementation into the dependency graph on
  # every build, that `jni` then compiles its native CMake on desktop
  # — linking a JVM into a desktop SSH client that never calls JNI.
  # On Windows CI the runner's default JDK is ARM64 while the target
  # is x64, so the jni link fails outright. 2.2.x predates the jni
  # dependency and still satisfies path_provider's `^2.2.5` floor, so
  # Android keeps a working path provider while desktop builds stop
  # dragging in a JVM. Revisit if path_provider_android makes jni
  # optional or jni stops declaring desktop targets.
  path_provider_android: '>=2.2.5 <2.3.0'

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 28
  adaptive_icon_background: "#282C34"
  adaptive_icon_foreground: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  linux:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
