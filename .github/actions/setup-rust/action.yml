# Composite action that activates the Rust toolchain pinned in
# `rust/rust-toolchain.toml`, optionally installs cross-compile
# targets, and primes `Swatinem/rust-cache` for the workspace.
#
# Why a composite (rather than per-job duplication):
#   - 7 release-matrix jobs all need the same setup. Extracting
#     the duplication is the third-time-DRY moment.
#   - Single source of truth for the pinned cache action SHA, so
#     bumping `Swatinem/rust-cache` is one edit, not seven.
#   - Cache key uniformity — every job feeds the same `workspaces:
#     rust` to the cache action, so `Cargo.lock` hash + rust
#     version are the only key differentiators (per OS + arch).
#
# Why `cargo --version` instead of `rustup toolchain install
# stable`: `rust-toolchain.toml` pins channel `1.95.0` (specific
# patch release for reproducibility — see the file's preamble).
# `rustup toolchain install stable` would install whatever the
# runner image's current `stable` is (e.g. 1.96), but the actual
# build then triggers a SECOND install of 1.95.0 the first time
# `cargo` runs in the `rust/` dir. Two toolchains on disk, the
# first one unused, two cache entries fighting. `cargo --version`
# inside `rust/` triggers exactly the install the toml pins, no
# divergence.

name: Setup Rust toolchain (with cache)
description: |
  Activate the rust-toolchain.toml-pinned channel + add optional
  cross-compile targets + prime Swatinem/rust-cache.

inputs:
  targets:
    description: "Space-separated cross-compile targets to install (e.g. 'aarch64-apple-darwin x86_64-apple-darwin')."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Activate Rust toolchain (rust-toolchain.toml)
      working-directory: rust
      shell: bash
      run: |
        # `cargo --version` inside the workspace dir triggers
        # rustup to read rust-toolchain.toml + install the pinned
        # channel if missing. Reporting `rustup show` gives the
        # GHA log a clean toolchain summary for cross-checking
        # the cache action's key.
        cargo --version
        rustc --version
        rustup show
        # Cross-compile targets are toolchain-scoped, so install
        # them after the channel is active. Empty input → no-op.
        if [ -n "${{ inputs.targets }}" ]; then
          for t in ${{ inputs.targets }}; do
            rustup target add "$t"
          done
        fi

    # Swatinem/rust-cache caches `~/.cargo/registry`, `~/.cargo/git`,
    # and the workspace `target/` dir keyed on Cargo.lock hash + the
    # active rustc version. After the first run on a given (OS, arch,
    # Cargo.lock) tuple, subsequent runs skip recompiling every
    # unchanged dep — the slow vendored-OpenSSL + ring builds land
    # in cache, and the build wall-clock drops back toward
    # pre-rust-port shape.
    #
    # `save-if: true` overrides the action's default
    # (`save-if: ${{ github.ref == default_branch }}`), which would
    # otherwise refuse to write the cache on any branch other than
    # `main`. Without the override, every push to a feature branch
    # rebuilds from scratch because there's nothing to restore from
    # — main's cache only populates on its own pushes (rare during
    # active feature work). Saving on every branch is the right
    # tradeoff: cache space is generous (10 GB per repo, GitHub
    # auto-evicts old entries) and the speedup applies to the
    # branches that actually iterate.
    #
    # `add-rust-environment-hash-key: false` + `key: ${{ hashFiles(
    # 'rust/rust-toolchain.toml') }}` replace the action's default
    # auto-derived "rust environment hash" with a deterministic key
    # based on the in-repo toolchain pin. Without this override,
    # the cache key changed per-run because the action calls
    # `rustup toolchain list` and hashes EVERY installed toolchain
    # into the key. The runner image ships a preinstalled stable
    # (e.g. 1.94.1); our composite then triggers a second install
    # of the toolchain.toml pin (1.95.0). On run A only `{1.94.1}`
    # is present at cache-step time → hash X. On run B both
    # `{1.94.1, 1.95.0}` are present → hash Y. Same source code,
    # different cache key, every run builds from scratch — the
    # user-reported "android/windows/macos still 15-22 min" symptom.
    # Replacement: hash `rust-toolchain.toml` itself. The file is
    # in version control, the only thing that changes when we
    # deliberately bump the pin, and bumping the pin *should*
    # invalidate the cache (different rustc may emit different
    # artefacts). One stable hash component, no flap.
    # `Cargo.lock` is still auto-included in the key by the action
    # (separate lockfile-hash component, independent of env-hash),
    # so dep changes still invalidate.
    - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      with:
        workspaces: rust
        save-if: 'true'
        add-rust-environment-hash-key: 'false'
        key: ${{ hashFiles('rust/rust-toolchain.toml') }}

    # Cargokit's target dir lives OUTSIDE the workspace `rust/target/`
    # the Swatinem cache covers — `rust_builder/cargokit/cmake/`
    # +`rust_builder/cargokit/gradle/plugin.gradle` hardcode it under
    # the per-platform Flutter build dir (`build/windows/x64/plugins/
    # rust_builder/cargokit_build/`, gradle's per-module `buildDir`,
    # etc.). Without a separate cache the platform builds re-compile
    # ring / openssl / russh / lfs_core from scratch on every run —
    # the user-reported "android/windows still 20 min" symptom that
    # the rust-cache key fix did NOT resolve, because that fix only
    # stabilised the workspace cache, not the cargokit one.
    #
    # Cache key includes Cargo.lock + rust-toolchain.toml (same
    # invalidation triggers as the workspace cache) AND the cargokit
    # shim sources themselves — cmake/gradle plugin upgrades change
    # build-script outputs and must not silently reuse stale
    # artefacts. Restore-keys lets a partial-hash hit (only Cargo.lock
    # changed, not toolchain) skip the dep recompile and only rebuild
    # the touched crates.
    - name: Cache cargokit target dir
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
      with:
        # cmake platforms (Windows / Linux / macOS desktop) write
        # under `build/<platform>/.../plugins/rust_builder/cargokit_build/`.
        # Android gradle plugin writes directly into the per-module
        # `buildDir`, which for a Flutter plugin lands at
        # `build/rust_builder/` relative to the project root. Glob
        # both shapes so a missing path on a given platform is a
        # silent no-op (cache action tolerates non-matching globs).
        path: |
          build/**/cargokit_build
          build/rust_builder
          android/**/cargokit_build
        key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml', 'rust_builder/cargokit/**') }}
        restore-keys: |
          cargokit-${{ runner.os }}-${{ runner.arch }}-
