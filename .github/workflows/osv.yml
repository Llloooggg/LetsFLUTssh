name: OSV-Scanner

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

permissions: read-all

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Both lockfiles scanned: Dart deps (pubspec.lock) and the
          # Rust security/transport core (rust/Cargo.lock — see
          # ARCHITECTURE.md §3.14). Dependabot covers the GitHub
          # Advisory Database on PRs; OSV here adds the broader OSV
          # DB (aggregates GHSA + RustSec + Go vuln DB + PyPI
          # advisories + ...) on push and weekly cron.
          # `--config=osv-scanner.toml` points at the repo-root
          # suppression file (see its header for the policy). Without
          # the explicit flag, osv-scanner looks for one config next
          # to each lockfile (`./osv-scanner.toml` for `pubspec.lock`,
          # `rust/osv-scanner.toml` for `rust/Cargo.lock`) — and the
          # Rust-side scan never picks up the root suppressions.
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pubspec.lock
            --lockfile=rust/Cargo.lock
            --format=sarif
            --output=results.sarif

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: results.sarif
