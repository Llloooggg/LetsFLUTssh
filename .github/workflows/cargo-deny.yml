name: cargo-deny

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted. Matches the cancel-in-progress
# rule in `osv.yml` / `semgrep.yml` / `scorecard.yml`.
concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC — same slot as OSV

permissions: read-all

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run cargo-deny
        # The Embark Studios action runs `cargo deny check` against
        # the Rust workspace using the rules in `rust/deny.toml`. It
        # gates four orthogonal axes that the rest of the security
        # perimeter does not cover:
        #
        #   * licenses — every transitive dep must sit under a license
        #     compatible with GPL-3.0 redistribution. Catches an MPL /
        #     GPL / commercial-only dep sneaking in via a bump.
        #   * bans — wildcard versions (`*` in Cargo.toml) + duplicate
        #     versions of the same crate (e.g. `regex` 0.x and 1.x in
        #     the tree at once) are flagged.
        #   * sources — only crates.io as a registry. A git dep
        #     pinning to a fork or private host must be allow-listed
        #     in `rust/deny.toml`.
        #   * advisories — second line behind OSV-Scanner. Same
        #     RustSec DB; failures here are also caught by `osv.yml`.
        #
        # Working directory is `rust/` because the workspace's
        # `Cargo.toml` and the `deny.toml` config live there. The
        # action reads `--manifest-path` and `--config` from CWD.
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          manifest-path: rust/Cargo.toml
          arguments: --workspace --all-features
          rust-version: stable
          log-level: warn
          command: check
          command-arguments: '--hide-inclusion-graph'
