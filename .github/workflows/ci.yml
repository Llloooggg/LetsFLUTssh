name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      # NOTE: `.github/**` deliberately NOT ignored. The release
      # preflight gates on a green CI check-run for the same SHA;
      # ignoring workflow-only changes makes the preflight fail
      # because the CI check-run never appears, breaking
      # `workflow_dispatch` of build-release on those commits.
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        # `libtss2-dev` is required by `tss-esapi` for the native TPM2
        # backend (`lfs_core::platform::linux::tpm_native`).
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libtss2-dev

      - name: Install Rust toolchain
        # `make test` now depends on `make rust-build` so the FRB
        # native blob (`rust/target/release/liblfs_frb.so`) is in place
        # before flutter_test loads it via `requireFrbLoaded`. Without
        # this dependency, every test that calls into Rust failed
        # silently against a missing .so. Toolchain version is pinned
        # in `rust/rust-toolchain.toml`; rustup auto-installs on the
        # first cargo invocation when `working-directory: rust`.
        working-directory: rust
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache cargo registry + workspace target
        # Same cache key as the `rust-ci` job below so the two jobs
        # populate / hit the same cache. Release-profile target dirs
        # (rust/target/release/, what `make rust-build` produces) and
        # debug target dirs (rust/target/debug/, what cargo test
        # produces in `rust-ci`) coexist in `rust/target/` so a single
        # cache covers both.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: make deps

      - name: Generate code
        run: make gen

      - name: Analyze
        run: make analyze

      - name: Lint workflows
        # actionlint catches YAML / shell / GHA expression bugs that
        # would otherwise only fail at workflow-dispatch time. The
        # local `make lint-workflows` target uses the same pinned
        # actionlint version + the same ignore config.
        run: make lint-workflows

      - name: Verify ARB parity (every locale has the same keys as app_en.arb)
        run: bash scripts/check-arb-parity.sh

      - name: Verify generated localisations are up to date
        # Re-run flutter gen-l10n in place and fail if it mutated any of
        # the checked-in generated files. Catches PRs that add ARB keys
        # but forget to commit the regenerated S.of(context) helpers.
        # --output-dir is ignored when l10n.yaml is present (Flutter warns
        # about it), so we run gen-l10n on the real tree and use
        # `git diff --exit-code` as the oracle.
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n/; then
            echo "::error::generated lib/l10n/app_localizations*.dart is out of sync with the ARB files. Run \`flutter gen-l10n\` and commit." >&2
            git diff -- lib/l10n/ | head -100 >&2 || true
            exit 1
          fi

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

      - name: Upload SonarCloud source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-source
          retention-days: 1
          path: |
            lib/**
            test/**
            rust/crates/**
            rust/Cargo.toml
            rust/Cargo.lock
            pubspec.yaml
            pubspec.lock
            sonar-project.properties

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ERRORS=""
          PATTERN='^(feat|fix|refactor|perf|build|test|docs|chore|ci|i18n|l10n|style|revert|security)(\([a-z0-9_+/-]+\))?!?: \S.+'

          # Read commit subjects straight from git so we get the full header —
          # `gh pr view --json commits.messageHeadline` truncates to ~72 chars
          # with an ellipsis, which breaks the revert-match below.
          git fetch --no-tags origin "$PR_BASE_REF" --depth=100
          COMMITS=$(git log --format='%s' "origin/$PR_BASE_REF..HEAD")

          # Extract subjects that later revert commits cancel out, so a
          # mistaken commit whose content has already been reverted in the
          # same PR does not block the merge. Accepts both git's default
          # `Revert "…"` and our conventional `revert: "…"` header forms.
          REVERTED=$(printf '%s\n' "$COMMITS" | \
            sed -nE 's/^(Revert |revert: )"([^"]+)".*/\2/p')

          while IFS= read -r MSG; do
            [ -z "$MSG" ] && continue
            # Skip merge commits (e.g. "Merge branch 'x' into y")
            echo "$MSG" | grep -qE '^Merge ' && continue
            # Skip Dependabot auto-generated commits (e.g. "Bump pkg from 1.0 to 2.0")
            echo "$MSG" | grep -qE '^Bump ' && continue
            # Skip revert commits (e.g. 'Revert "feat: something"')
            echo "$MSG" | grep -qE '^Revert "' && continue
            # Skip commits that a later revert in this PR cancels out.
            if [ -n "$REVERTED" ] && printf '%s\n' "$REVERTED" | grep -qxF "$MSG"; then
              continue
            fi
            if ! echo "$MSG" | grep -qE "$PATTERN"; then
              ERRORS="$ERRORS  ✗ $MSG\n"
            fi
          done <<< "$COMMITS"

          if [ -n "$ERRORS" ]; then
            echo "::error::Some commit messages don't follow the required format."
            echo ""
            echo "Expected format: type: short description"
            echo "Valid types: feat, fix, refactor, perf, build, test, docs, chore, ci, i18n, l10n, style, revert, security"
            echo ""
            echo "Invalid commits:"
            echo -e "$ERRORS"
            echo ""
            echo "See docs/CONTRIBUTING.md for details."
            exit 1
          fi

          echo "All commit messages follow the required format ✓"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  rust-ci:
    # Rust security/transport core (rust/) — see ARCHITECTURE.md §3.14.
    # Runs alongside the Dart `ci` job; the cache + light test surface
    # at sub-phase 1.x makes this cheap. Cross-target compile coverage
    # (Apple / Windows / Android / iOS) lives in `rust-cross-check`
    # below; this job stays ubuntu-latest for the full clippy + test +
    # deny pipeline so the heavyweight gates run once on the canonical
    # host.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        # Toolchain version is pinned in `rust/rust-toolchain.toml`
        # (channel = "1.95.0"); rustup auto-installs that version
        # on the first cargo invocation in `working-directory: rust`,
        # so we do not need to specify a version here. Keeping the
        # explicit `rustup toolchain install` pre-step lets us also
        # add the rustfmt + clippy components for the active
        # toolchain in one shot.
        working-directory: rust
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache cargo registry + workspace target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace -- -D warnings
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Install cargo-deny
        # `--locked` so the install resolves against cargo-deny's own
        # Cargo.lock — reproducible across CI runs. Pin the version
        # so a CVE in a future cargo-deny release does not silently
        # rotate into our security-gating binary.
        run: cargo install --locked --version 0.19.4 cargo-deny

      - name: cargo deny check
        # Three gates from `rust/deny.toml`:
        #   advisories — RustSec database CVE check
        #   licenses   — every transitive license is on the allow-list
        #   bans       — duplicate-version warnings, wildcard requirements denied
        working-directory: rust
        run: cargo deny --all-features check

      - name: Cargo.lock parity
        # Mirrors the existing `flutter gen-l10n` parity check above:
        # if a contributor bumps a Cargo.toml entry without committing
        # the regenerated Cargo.lock, this fails. `--workspace` so the
        # check covers every member crate; `--locked` so cargo refuses
        # to mutate the lock if a fresh resolve would diverge — the
        # combination of those two plus `git diff --exit-code` is the
        # idiomatic Rust-side equivalent of `npm ci`'s lock check.
        working-directory: rust
        run: |
          cargo update --workspace --locked
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::rust/Cargo.lock is out of sync with rust/Cargo.toml. Run \`cargo update --workspace\` and commit the result." >&2
            git diff -- Cargo.lock | head -100 >&2 || true
            exit 1
          fi

      - name: Install cargo-machete
        # Pinned for reproducibility — same rationale as cargo-deny:
        # a future machete release rotating into our quality gate
        # without a deliberate bump is a silent risk.
        run: cargo install --locked --version 0.7.0 cargo-machete

      - name: cargo machete (unused dependencies)
        # Catches dependencies declared in any workspace member's
        # Cargo.toml that are never `use`d in source. Each entry in
        # Cargo.toml is build-time + audit cost; unused ones add
        # both for nothing. `--with-metadata` reads `cargo metadata`
        # for transitive resolution, more accurate than the lexical
        # default.
        working-directory: rust
        run: cargo machete --with-metadata

      - name: Install cargo-llvm-cov
        # Coverage tool of choice for Rust workspaces — uses the
        # source-based `-C instrument-coverage` LLVM facility, which
        # is more accurate than line-based fallbacks (tarpaulin) and
        # supports cfg-gated code paths properly.
        run: cargo install --locked --version 0.6.20 cargo-llvm-cov

      - name: cargo llvm-cov (workspace coverage → lcov)
        # Outputs `rust-lcov.info` in lcov.info format identical to
        # the Dart side, so `ci-sonarcloud.yml` can pass both files
        # to the Sonar scanner via the same `sonar.coverageReportPaths`
        # mechanism. `--all-features` ensures cfg-gated branches show
        # up in coverage rather than being silently elided.
        working-directory: rust
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path ../rust-lcov.info

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: rust-lcov.info
          retention-days: 1

  rust-cross-check:
    # Cross-target compile validation for cfg-gated Rust code paths
    # the canonical `rust-ci` (ubuntu-latest) never sees. Runs `cargo
    # check --workspace --all-targets` per target on its native
    # runner — clippy + test stay in `rust-ci` because they catch
    # 95 % of bugs at lower latency on a single host. This job's job
    # is to ensure that, e.g., a dependency bump that breaks
    # `cfg(any(target_os = "macos", target_os = "ios"))` code in
    # `lfs_os_security::hardware_tier_vault::apple` (~700 LOC of
    # Apple-cfg Rust) surfaces on the PR check, not on the next
    # release tag through `build-release.yml`.
    #
    # Targets covered:
    #   - Apple desktop + iOS  (macos-latest)
    #   - Windows MSVC         (windows-latest)
    #   - Android NDK ABIs     (ubuntu-latest via cargo-ndk)
    #
    # Linux x86_64 host is already covered by `rust-ci` above.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple desktop + iOS — Apple-cfg Rust (Secure Enclave,
          # SecItemAdd, LAContext, NSPasteboard, etc.) only compiles
          # under cfg(any(target_os = "macos", target_os = "ios")).
          - { runner: macos-latest,   target: aarch64-apple-darwin,    label: macos-arm64 }
          - { runner: macos-latest,   target: x86_64-apple-darwin,     label: macos-x64   }
          - { runner: macos-latest,   target: aarch64-apple-ios,       label: ios-arm64   }
          # Windows MSVC — Windows-cfg Rust (CredWriteW,
          # UserConsentVerifier, hidden HWND for session-lock when
          # NI-3 lands).
          # `windows-2025-vs2026` (not `windows-latest`) — silences the
          # GitHub redirect notice + locks the VS 2026 / MSVC toolchain.
          - { runner: windows-2025-vs2026, target: x86_64-pc-windows-msvc, label: windows-x64 }
          # Android NDK ABIs — gates the upcoming Tier 3 Android JNI
          # work (java.security.KeyStore + BiometricPrompt direct
          # calls). Cargokit already builds these targets at release
          # time; this job catches breakage on every PR.
          - { runner: ubuntu-latest,  target: aarch64-linux-android,   label: android-arm64, ndk: true }
          - { runner: ubuntu-latest,  target: armv7-linux-androideabi, label: android-arm,   ndk: true }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install Rust toolchain + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup show

      - name: Install cargo-ndk (Android only)
        # `cargo-ndk` knows where the NDK headers live and forwards
        # the right sysroot / linker flags to cargo per ABI. Pinned
        # alongside the version used in build-release.yml::build-android
        # so PR-time check matches release-time build.
        if: matrix.ndk == true
        run: cargo install --locked --version 4.1.2 cargo-ndk

      - name: Cache cargo registry + workspace target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: cargo check (${{ matrix.label }})
        # `--all-targets` keeps test / example / bench code in scope
        # so a cfg-gated test module that references a renamed FFI
        # symbol still triggers the failure here. `--locked` so the
        # check resolves against the committed Cargo.lock — the same
        # lock parity the upcoming Wave 2 check enforces.
        working-directory: rust
        shell: bash
        run: |
          if [ "${{ matrix.ndk }}" = "true" ]; then
            cargo ndk --target ${{ matrix.target }} -- check --workspace --all-targets --locked
          else
            cargo check --workspace --all-targets --target ${{ matrix.target }} --locked
          fi
