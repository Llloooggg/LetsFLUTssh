name: CI / SonarCloud

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: ci-sonarcloud-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: 'CI run ID to pull coverage from (optional)'
        required: false

permissions: read-all

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    # Trunk-only: scan after a successful `push` CI run on main. CI
    # also runs for `pull_request` events (head_branch = the PR's
    # source branch, e.g. dev), and those completions trigger this
    # workflow too — but PR runs deliberately don't upload the
    # `sonar-source` / coverage artefacts, so gate on the CI run's
    # originating event being `push` to avoid launching a scan that
    # can only die on the missing artefact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    permissions:
      actions: read
      contents: read
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci-run-id }}
    steps:
      - name: Checkout repository (for SCM data)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download SonarCloud source artifact
        if: env.CI_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-source
          path: .
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download coverage artifact
        if: env.CI_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Rust coverage artifact
        # `rust-lcov.info` is produced by `make rust-coverage` (cargo
        # llvm-cov) inside the canonical `ci` job. Pulled here so
        # `sonar-project.properties` can hand it to the scanner via
        # the community-Rust `sonar.community.rust.lcov.reportPaths`
        # key — Rust coverage shows up alongside Dart in the same
        # project. Continue-on-error: a CI run that pre-dates the
        # rust-coverage artifact (older commits, hotfix branches)
        # should still produce a Sonar scan with Dart-only data
        # rather than failing outright.
        if: env.CI_RUN_ID != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-coverage
          path: .
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Setup Flutter
        if: env.CI_RUN_ID != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pin to the SDK build-release.yml ships against — same reason
          # as ci.yml. Bump together with build-release.yml.
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        if: env.CI_RUN_ID != ''
        run: flutter pub get

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ env.BRANCH }}
