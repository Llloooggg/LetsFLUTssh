          # doesn't push the repo past the limit on its own.
          cache: false

      - uses: ./.github/actions/setup-rust
        # Per-ABI cargo invocations through the cargokit gradle
        # plugin produce `liblfs_frb.so` for every supported ABI.
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        # `cargo-ndk` finds the right NDK toolchain headers/libs
        # for each Android ABI when cargokit invokes cargo.
        # `ANDROID_NDK_HOME` is set by the runner image; cargo-ndk
        # reads it automatically. Pinned to a specific version to
        # keep the install reproducible.
        run: cargo install --locked --version 4.1.2 cargo-ndk

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES secrets are required for signed releases"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build APKs (per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk letsflutssh-${{ needs.preflight.outputs.version }}-android-arm64.apk
          mv app-armeabi-v7a-release.apk letsflutssh-${{ needs.preflight.outputs.version }}-android-arm32.apk
          mv app-x86_64-release.apk letsflutssh-${{ needs.preflight.outputs.version }}-android-x64.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          retention-days: 7
          path: build/app/outputs/flutter-apk/letsflutssh-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    needs: [preflight, build-linux-x64, build-linux-arm64, build-windows, build-windows-arm64, build-macos, build-ios-unsigned, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate Rust SBOM (CycloneDX)
        # Software Bill of Materials for the Rust workspace in
        # CycloneDX 1.5 JSON format — every transitive crate (russh,
        # tokio, RustCrypto family, …) with version, license, source
        # URL. Attached to the release as
        # `letsflutssh-<version>.rust-sbom.cdx.json`.
        #
        # Modern supply-chain tools (Dependency-Track, Trivy SBOM
        # scan, GitHub's own dependency graph) consume this format
        # directly, so a downstream user can answer "does this
        # release ship a vulnerable version of <crate>?" without
        # re-running cargo against our lockfile.
        #
        # The Dart-side SBOM is not generated here — Dart's pub
        # ecosystem does not have a maintained CycloneDX tool with
        # a published-and-pinnable version on pub.dev today.
        # Pubspec dependency tree is already exposed through
        # GitHub's automatic dependency graph
        # (https://github.com/Llloooggg/LetsFLUTssh/network/dependencies)
        # which derives the same data from `pubspec.lock`. If a
        # cyclonedx-dart tool stabilises later, add a sibling step
        # here.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # Pinned version for reproducibility (same rationale as
          # cargo-llvm-cov / cargo-machete in `make setup-rust-tools`).
          cargo install --locked --version 0.5.7 cargo-cyclonedx
          (cd rust && cargo cyclonedx --all --format json)
          # cargo-cyclonedx writes per-crate `bom.json` files next
          # to each crate's Cargo.toml; collect them under one
          # release artefact.
          mkdir -p sbom
          find rust/crates -maxdepth 2 -name 'bom.json' -print0 \
            | while IFS= read -r -d '' f; do
                crate=$(basename "$(dirname "$f")")
                cp "$f" "sbom/${crate}.cdx.json"
              done
          tar czf "artifacts/letsflutssh-${VERSION}.rust-sbom.cdx.tar.gz" -C sbom .
          echo "Rust SBOM bundle → letsflutssh-${VERSION}.rust-sbom.cdx.tar.gz ($(du -h "artifacts/letsflutssh-${VERSION}.rust-sbom.cdx.tar.gz" | cut -f1))"

      - name: Sign release artefacts (Ed25519)
        # Single signature per release:
        #
        # 1) `letsflutssh-<version>.sha256sums` — plaintext
        #    `sha256  name` lines, compatible with `sha256sum --check`.
        # 2) `letsflutssh-<version>.sha256sums.sig` — one Ed25519
        #    signature over the whole manifest. Covers every artefact
        #    in the release via its entry in the manifest.
        #
        # Naming uses `.` (not `-`) before the suffix so case-insensitive
        # alphabetical sort on the GitHub Releases page groups all aux
        # artefacts (manifest, signature, attestation) at the bottom
        # instead of slotting them between platform binaries.
        #
        # Old per-artefact `<binary>.sig` files are intentionally
        # **not** produced here. Installs on releases older than the
        # switch-over version (≤ 5.8.1) expect per-artefact signatures
        # and will fail to auto-update across this boundary — that is
        # the expected behaviour. The README tells those users to
        # reinstall manually once; from that reinstall onward, the
        # manifest flow is what drives all future updates.
        #
        # The public key is **not** attached to the release — a
        # downloaded `.pub` forged under MITM would be
        # self-consistent with a forged `.sig`, implying manual-verify
        # security the file cannot actually provide. The app's trust
        # anchor is the byte-identical key baked into
        # `lib/core/update/release_signing.dart`; that bakes in with
        # the install and is what the auto-updater verifies against.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is empty — aborting release so the update channel stays locked"
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/release-key.pem
          trap 'rm -f /tmp/release-key.pem' EXIT

          # Build the manifest (sha256sum format), names only.
          MANIFEST="artifacts/letsflutssh-${VERSION}.sha256sums"
          : > "$MANIFEST"
          for d in artifacts/linux-x64 artifacts/linux-arm64 \
                   artifacts/windows-x64 artifacts/windows-arm64 \
                   artifacts/macos-universal artifacts/android-apk \
                   artifacts/ios-unsigned; do
            [ -d "$d" ] || continue
            (cd "$d" && find . -maxdepth 1 -type f \
              ! -name '*.sig' ! -name '*.intoto.jsonl' \
              ! -name '*.sha256sums*' \
              -exec sha256sum {} +) \
              | sed 's| \./| |' >> "$MANIFEST"
          done
          echo "Manifest entries: $(wc -l <"$MANIFEST")"

          # Sign the manifest.
          openssl pkeyutl -sign -inkey /tmp/release-key.pem \
            -rawin -in "$MANIFEST" -out "${MANIFEST}.sig"
          echo "Signed manifest → $(basename "${MANIFEST}.sig") ($(wc -c <"${MANIFEST}.sig") bytes)"

      - name: Attest build provenance
        # Enumerate binaries by extension, NOT `artifacts/.../*` — the
        # previous globs pulled in our Ed25519 `.sig` files that the
        # sign step wrote a few steps earlier. Attesting a signature
        # file is redundant (the signature is metadata ABOUT the
        # binary, not a buildable artefact), produces noisy extra
        # attestation bundles on the release, and falsely implies that
        # `.sig` is something consumers should verify through the
        # SLSA chain — it is not: clients check the Ed25519 signature
        # through the pinned public keys in `release_signing.dart`,
        # a separate trust path.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/*.AppImage
            artifacts/linux-x64/*.deb
            artifacts/linux-arm64/*.tar.gz
            artifacts/linux-arm64/*.AppImage
            artifacts/linux-arm64/*.deb
            artifacts/windows-x64/*.zip
            artifacts/windows-x64/*.exe
            artifacts/windows-arm64/*.zip
            artifacts/macos-universal/*.tar.gz
            artifacts/macos-universal/*.dmg
            artifacts/android-apk/*.apk
            artifacts/ios-unsigned/*.ipa

      - name: Install cosign
        # Sigstore client. Pinned to v4.1.1 (released 2026-03-26),
        # the latest stable at the time of writing. Cosign binary
        # itself is pinned to v3.0.6 (released 2026-04-06) — the
        # action would otherwise default to the latest at run
        # time, which silently rotates our trust-establishment
        # surface. Both pins update together when a security or
        # CVE fix demands; routine version bumps stay deliberate.
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Cosign keyless sign release manifest
        # Layered alongside the existing Ed25519 manifest signature:
        #
        #   * Ed25519 (above) — the trust anchor the in-app updater
        #     uses; pinned public key baked into
        #     `release_signing.dart`. This is what gates auto-update.
        #   * Cosign keyless (this step) — OIDC-rooted signature
        #     with a Rekor transparency-log entry. No private key
        #     in the repo or in any secret; the workflow's GitHub
        #     OIDC identity (`https://github.com/<repo>/.github/
        #     workflows/build-release.yml@<ref>`) is the signer
        #     identity, and the public log entry is independently
        #     auditable via `cosign verify-blob` against that
        #     identity.
        #
        # Two-anchor signing means a future compromise of either
        # private key (Ed25519 leak) OR a future compromise of
        # the OIDC issuer alone is not sufficient to forge a
        # release — an attacker would need both the Ed25519 key
        # AND a way to mint a Sigstore-trusted GitHub OIDC token
        # for this repo.
        #
        # `id-token: write` permission already granted on the
        # release job (used by attest-build-provenance above);
        # cosign's keyless flow consumes the same OIDC token
        # without additional secret config.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST="artifacts/letsflutssh-${VERSION}.sha256sums"
          # `--yes` skips the interactive Rekor-upload prompt.
          # The bundle file holds the signature + certificate +
          # transparency-log entry in one Sigstore-format blob,
          # ready for `cosign verify-blob --bundle <bundle>` on
          # the consumer side.
          cosign sign-blob \
            --yes \
            --bundle "${MANIFEST}.cosign-bundle" \
            "$MANIFEST"
          echo "Cosign keyless signed → $(basename "${MANIFEST}.cosign-bundle")"

      - name: Export provenance for release
        # A single `attest-build-provenance` call covers every artefact
        # in one bundle — the attestation's `subject` array lists all
        # of them with their sha256 digests, so downloading the bundle
        # for any one artefact returns the exact same file. Shipping
        # one `letsflutssh-<version>.intoto.jsonl` instead of ten
        # identical copies is cleaner and reflects the truth:
        # attestation is per-release, not per-artefact.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # Use any binary to pull the bundle — they all map to the
          # same attestation.
          anchor=""
          for f in artifacts/linux-x64/* artifacts/linux-arm64/* \
                   artifacts/windows-x64/* artifacts/windows-arm64/* \
                   artifacts/macos-universal/* artifacts/android-apk/* \
                   artifacts/ios-unsigned/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.intoto.jsonl|*.sha256sums*) continue ;;
            esac
            anchor="$f"
            break
          done
          if [ -z "$anchor" ]; then
            echo "::warning::No artefact found to anchor attestation download"
            exit 0
          fi
          if gh attestation download "$anchor" -R "${{ github.repository }}"; then
            BUNDLE=$(ls -t sha256*.jsonl 2>/dev/null | head -1)
            if [ -n "$BUNDLE" ]; then
              mv "$BUNDLE" "artifacts/letsflutssh-${VERSION}.intoto.jsonl"
              echo "Exported provenance → letsflutssh-${VERSION}.intoto.jsonl"
            fi
          else
            echo "::warning::No attestation found for ${anchor}"
          fi

      - name: Resolve release tag
        id: tag
        run: |
          # Assign first so shellcheck sees a normal variable
          # comparison rather than a literal-vs-glob match against a
          # GHA placeholder it cannot reason about (placeholders are
          # substituted by GitHub Actions before bash sees them, so
          # SC2193 is a false positive on the inline form).
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ needs.preflight.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag if missing (manual dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag ${TAG}"
          else
            echo "Tag ${TAG} already exists"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Get the tag immediately before this one (by version order)
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | awk "found{print;exit} /^${TAG}\$/{found=1}")
          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="$PREV_TAG..$TAG"
          fi

          # Defensive cap. The per-commit list targets normal release windows
          # (tens of commits between tags). If a range ever spans hundreds of
          # commits — a fork point or a missing intermediate tag — enumerating
          # every entry produces an unreadable wall and can approach GitHub's
          # release-body size limit. Past the cap, emit per-type counts plus a
          # compare link instead. Hand-written prose for a milestone release is
          # edited into the GitHub Release directly, never stored in the repo.
          COMMIT_COUNT=$(git log "$RANGE" --oneline --no-merges | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -gt 200 ]; then
            echo "Range $RANGE has $COMMIT_COUNT commits — emitting summary instead of full list"
            SUMMARY=$(git log "$RANGE" --format='%s' --no-merges \
              | sed -E 's/^([a-z]+)(\([a-z0-9-]+\))?!?:.*/\1/' \
              | grep -E '^(feat|fix|refactor|perf|security|i18n|l10n|revert|chore|build|test|docs|ci|style)$' \
              | sort | uniq -c | sort -rn \
              | awk '{printf "- %s: %s\n", $2, $1}')
            {
              echo "body<<CHANGELOG_EOF"
              echo "This release spans ${COMMIT_COUNT} commits. Summary by change type:"
              echo
              printf '%s\n' "$SUMMARY"
              if [ -n "$PREV_TAG" ]; then
                echo
                echo "Full commit log: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
              fi
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          SECURITY=""
          LOCALIZATION=""
          REVERTS=""
          DEPS=""

          # Parse conventional commits with optional scope and breaking-change
          # marker: `type(scope)!: body`. The scope (e.g. "installer",
          # "import") surfaces as a leading `(scope)` in the changelog so
          # users see which module each entry touches; `!` after the type
          # or scope flags a breaking change and renders as a bold
          # `**BREAKING**` prefix so the entry stands out in the list.
          #
          # Accepted types mirror the commit-lint regex in ci.yml
          # (feat|fix|refactor|perf|build|test|docs|chore|ci|i18n|l10n|
          # style|revert|security). User-facing buckets: Security,
          # Features, Reverts, Improvements, Fixes, Localization,
          # Dependencies. Internal types (build, test, docs, ci, style)
          # are accepted by the linter but intentionally excluded from
          # release notes — they are plumbing, not user-visible change.
          while IFS= read -r line; do
            MSG="${line#* }"
            if [[ "$MSG" =~ ^([a-z]+)(\(([a-z0-9][a-z0-9-]*)\))?(!)?:[[:space:]]+(.+)$ ]]; then
              TYPE="${BASH_REMATCH[1]}"
              SCOPE="${BASH_REMATCH[3]}"
              BREAKING="${BASH_REMATCH[4]}"
              BODY="${BASH_REMATCH[5]}"
              PREFIX=""
              [ -n "$SCOPE" ] && PREFIX="($SCOPE) "
              [ -n "$BREAKING" ] && PREFIX="**BREAKING** ${PREFIX}"
              case "$TYPE" in
                feat)          FEATURES="$FEATURES- ${PREFIX}${BODY}\n" ;;
                fix)           FIXES="$FIXES- ${PREFIX}${BODY}\n" ;;
                refactor|perf) IMPROVEMENTS="$IMPROVEMENTS- ${PREFIX}${BODY}\n" ;;
                security)      SECURITY="$SECURITY- ${PREFIX}${BODY}\n" ;;
                i18n|l10n)     LOCALIZATION="$LOCALIZATION- ${PREFIX}${BODY}\n" ;;
                revert)        REVERTS="$REVERTS- ${PREFIX}${BODY}\n" ;;
                chore)
                  # Only surface dependency bumps under chore.
                  [ "$SCOPE" = "deps" ] && DEPS="$DEPS- ${BODY}\n"
                  ;;
              esac
            elif [[ "$MSG" =~ ^Bump[[:space:]]+.+[[:space:]]+from[[:space:]]+.+[[:space:]]+to[[:space:]]+.+$ ]]; then
              # Dependabot raw subject ("Bump dartssh2 from 2.15.0 to 2.16.0").
              # Commit-lint skips these via a dedicated `^Bump ` branch, and
              # dependabot-auto.yml lets them merge with the original subject
              # intact — no `chore(deps):` rewrite anywhere in the pipeline.
              # Without this fallback every automerged Dependabot PR produced
              # a release with an empty Dependencies section. Strip the
              # `Bump ` prefix so entries read "dartssh2 from 2.15.0 to 2.16.0".
              DEPS="$DEPS- ${MSG#Bump }\n"
            fi
          done <<< "$(git log "$RANGE" --oneline --no-merges)"

          BODY=""
          # Security-first pinned callout — surfaces upgrade urgency
          # before the user scrolls into the change lists. Releases
          # without any `security:` commit render no callout, so the
          # normal flow stays visually unchanged.
          if [ -n "$SECURITY" ]; then
            BODY="> ⚠ **Security updates in this release — upgrading is recommended.**\n\n### Security\n$SECURITY\n"
          fi
          [ -n "$FEATURES" ] && BODY="$BODY### Features\n$FEATURES\n"
          [ -n "$REVERTS" ] && BODY="$BODY### Reverts\n$REVERTS\n"
          [ -n "$IMPROVEMENTS" ] && BODY="$BODY### Improvements\n$IMPROVEMENTS\n"
          [ -n "$FIXES" ] && BODY="$BODY### Fixes\n$FIXES\n"
          [ -n "$LOCALIZATION" ] && BODY="$BODY### Localization\n$LOCALIZATION\n"
          [ -n "$DEPS" ] && BODY="$BODY### Dependencies\n$DEPS\n"
          [ -z "$BODY" ] && BODY="Maintenance release.\n"

          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo -e "$BODY" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/linux-x64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz
            artifacts/linux-x64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.AppImage
            artifacts/linux-x64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.deb
            artifacts/linux-arm64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.tar.gz
            artifacts/linux-arm64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.AppImage
            artifacts/linux-arm64/letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.deb
            artifacts/windows-x64/letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64.zip
            artifacts/windows-x64/letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64-setup.exe
            artifacts/windows-arm64/letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64.zip
            artifacts/macos-universal/letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.tar.gz
            artifacts/macos-universal/letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.dmg
            artifacts/android-apk/letsflutssh-${{ needs.preflight.outputs.version }}-android-arm64.apk
            artifacts/android-apk/letsflutssh-${{ needs.preflight.outputs.version }}-android-arm32.apk
            artifacts/android-apk/letsflutssh-${{ needs.preflight.outputs.version }}-android-x64.apk
            artifacts/ios-unsigned/letsflutssh-${{ needs.preflight.outputs.version }}-ios-unsigned.ipa
            artifacts/letsflutssh-${{ needs.preflight.outputs.version }}.sha256sums
            artifacts/letsflutssh-${{ needs.preflight.outputs.version }}.sha256sums.sig
            artifacts/letsflutssh-${{ needs.preflight.outputs.version }}.sha256sums.cosign-bundle
            artifacts/letsflutssh-${{ needs.preflight.outputs.version }}.intoto.jsonl
            artifacts/letsflutssh-${{ needs.preflight.outputs.version }}.rust-sbom.cdx.tar.gz
