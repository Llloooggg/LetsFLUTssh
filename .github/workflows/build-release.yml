name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with artifacts'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.get.outputs.version }}
      source_date_epoch: ${{ steps.get.outputs.source_date_epoch }}
    steps:
      - name: Verify CI status
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push — auto-tag already verified CI passed
            echo "Tag-triggered build — CI verified by auto-tag ✓"
          elif [ "$REF" != "refs/heads/main" ]; then
            # Non-main branch dispatch (dev, feature/*, fix/*, anything
            # below release line) — local `make check` is the source of
            # truth; CI is not required to gate those builds. The
            # branch name is not part of the published artifact, so a
            # mis-gated dispatch here only produces throwaway debug
            # output. Main stays enforced — release artefacts MUST
            # match a green CI run.
            echo "Non-main branch dispatch (${REF}) — skipping CI check (local validation) ✓"
          else
            # Main-branch manual dispatch — verify once, no polling
            STATUS=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci" and .app.slug == "github-actions")] | if length == 0 then "missing" else .[0].conclusion // "pending" end')

            if [ "$STATUS" = "success" ]; then
              echo "CI passed ✓"
            else
              echo "::error::CI status is '${STATUS}' for ${SHA}. Run CI first, then retry."
              exit 1
            fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
          # fetch-depth: 1 keeps `.git/HEAD` populated so `git log`
          # can report the commit timestamp for SOURCE_DATE_EPOCH.
          fetch-depth: 1

      - name: Extract version + source-date-epoch from pubspec.yaml
        id: get
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VER}"

          # Reproducible-build clock. Every downstream tool that
          # honours SOURCE_DATE_EPOCH (dpkg-deb, appimagetool, tar
          # --mtime, Python ZipFile wrapper) stamps artefacts with
          # this timestamp instead of the CI runner's wall clock,
          # so two runs of the same commit produce byte-identical
          # output. Source: the committer-date of the HEAD commit
          # the workflow is building (for tag pushes, the commit
          # the tag points at).
          SDE=$(git log -1 --format=%ct HEAD)
          echo "source_date_epoch=${SDE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH: ${SDE}"

  build-linux-x64:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Reproducible-build clock: honoured by dpkg-deb, appimagetool,
      # gzip-with-`-n`, tar `--mtime=@${SOURCE_DATE_EPOCH}`. Same two
      # runs on the same commit produce byte-identical artefacts,
      # so a user can rebuild from source and compare the sha256 of
      # our official `.deb` / `.AppImage` / `.tar.gz` against their
      # own as a supply-chain check.
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pin Flutter version so every x64 job in the release
          # matrix builds against the same SDK, matching the
          # `FLUTTER_SHA` the ARM64 jobs git-clone — bump both
          # together. Sustains build reproducibility across
          # runner-image rotations.
          flutter-version: 3.41.9
          # Disabled, second time. The first round
          # (commit 58de515c) freed ~5 GB of cache budget and
          # let cargokit caches stop getting evicted every CI
          # run; we re-enabled it (02010517) once the per-job
          # cargokit key split (d38c27e6) reduced the cargokit
          # footprint forecast. The math overlooked one thing:
          # the iOS cargokit-cache fix (178ed25e) added a
          # *seventh* cargokit entry under `~/Library/Developer/
          # Xcode/DerivedData` (~541 MB) that wasn't in the
          # forecast, and the per-job split itself gave us a
          # cargokit per platform job rather than per (os, arch)
          # tuple — 6 entries × 300-900 MB instead of the 4 the
          # estimate assumed. Steady state crept back over 10 GB
          # (~10.5 GB measured in run 25371640555), LRU eviction
          # picked off cargokit caches between every run again,
          # and Linux x64 / Windows / Android paid full cold-
          # rebuild cost on each push (Linux 4m → 10m, Windows
          # 9m → 20m, Android 14m → 21m).
          #
          # Disabling Flutter SDK caching here (~5 GB across the
          # 5 platform jobs + their pub-cache siblings) brings
          # the steady-state footprint to ~5 GB and gives the
          # cargokit + rust-cache layers persistent room. Trade
          # ~1 min per job on SDK mirror download (5 jobs ×
          # 1 min ≈ 5 min total CI wallclock cost) against
          # ~10 min per Windows / Android cold rebuild (one
          # platform alone) recovered.
          #
          # Keep `cache: true` in `ci.yml`, `reproducibility-
          # check.yml`, `ci-sonarcloud.yml`. Those are single-
          # platform Linux jobs whose 1.6 GB Flutter SDK cache
          # doesn't push the repo past the limit on its own.
          cache: false

      - name: Install Linux build dependencies
        # `libtss2-dev` is required by `tss-esapi` for the native TPM2
        # backend (`lfs_core::platform::linux::tpm_native`). The native
        # module compiles into every Linux release build so a future
        # `LFS_TPM_BACKEND=native` flip needs no rebuild — the
        # subprocess backend stays the runtime default until verified.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libtss2-dev lld

      - uses: ./.github/actions/setup-rust

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux x64
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          # Reproducible tar: sort entries by name, wipe uid/gid/
          # owner strings, pin mtime to SOURCE_DATE_EPOCH. Pipe into
          # `gzip -n` so the compressed stream carries no filename
          # / timestamp in its own header. Two runs at the same
          # commit produce an identical sha256.
          cd build/linux/x64/release/bundle
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - . \
            | gzip -n -9 \
            > ${{ github.workspace }}/letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz

      - name: Cache appimagetool
        id: cache-appimagetool
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: appimagetool
          key: appimagetool-1.9.1-x86_64-ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

      - name: Package AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download appimagetool if not cached, then verify hash (even from cache)
          if [ ! -f appimagetool ]; then
            gh release download 1.9.1 --repo AppImage/appimagetool --pattern 'appimagetool-x86_64.AppImage' --output appimagetool
          fi
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          # Create AppDir structure
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/lib $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          cp linux/packaging/letsflutssh.desktop $APPDIR/usr/share/applications/
          cp linux/packaging/letsflutssh.desktop $APPDIR/
          cp assets/icons/icon.png $APPDIR/usr/share/icons/hicolor/256x256/apps/letsflutssh.png
          cp assets/icons/icon.png $APPDIR/letsflutssh.png
          # Create AppRun
          cat > $APPDIR/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/letsflutssh" "$@"
          APPRUN
          chmod +x $APPDIR/AppRun
          # Build AppImage
          ARCH=x86_64 ./appimagetool --no-appstream $APPDIR letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.AppImage

      - name: Package deb
        run: |
          VER=${{ needs.preflight.outputs.version }}
          PKG=letsflutssh_${VER}_amd64
          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/usr/bin
          mkdir -p $PKG/usr/lib/letsflutssh
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps
          # Copy app bundle to /usr/lib, symlink binary
          cp -r build/linux/x64/release/bundle/* $PKG/usr/lib/letsflutssh/
          ln -sf /usr/lib/letsflutssh/letsflutssh $PKG/usr/bin/letsflutssh
          cp linux/packaging/letsflutssh.desktop $PKG/usr/share/applications/
          cp assets/icons/icon.png $PKG/usr/share/icons/hicolor/256x256/apps/letsflutssh.png
          # Control file
          cat > $PKG/DEBIAN/control << EOF
          Package: letsflutssh
          Version: ${VER}
          Architecture: amd64
          Maintainer: LetsFLUTssh <noreply@letsflutssh.dev>
          Description: Lightweight cross-platform SSH/SFTP client
           A full-featured SSH terminal and SFTP file browser with session
           management, encrypted credential storage, and tiling terminal layout.
          Depends: libgtk-3-0, libsecret-1-0, libtss2-esys-3.0.2-0 | libtss2-esys-0
          Section: net
          Priority: optional
          EOF
          dpkg-deb --build $PKG
          mv ${PKG}.deb letsflutssh-${VER}-linux-x64.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64
          retention-days: 7
          path: |
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.AppImage
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-x64.deb

  build-linux-arm64:
    # Native ARM64 build on the GitHub-hosted `ubuntu-24.04-arm`
    # runner (free for public repositories). Targets users on
    # Raspberry Pi 5 (8 GB), Asahi Linux on Apple Silicon, AWS
    # Graviton, Ampere Altra, and any other aarch64 desktop
    # Linux. Cross-compile from ubuntu-latest x86_64 was the
    # alternative; native runner is simpler (no `gcc-aarch64-linux-gnu`
    # cross-toolchain, no `cargo --target aarch64-unknown-linux-gnu`
    # gymnastics, no QEMU for the AppImage build) and produces
    # binaries identical in shape to what an end-user would
    # build from source on their own ARM64 machine.
    needs: preflight
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # Flutter does NOT publish a Linux ARM64 SDK tarball — `subosito/
      # flutter-action`'s resolver returns "Unable to determine Flutter
      # version" for any architecture: arm64 query because Flutter's
      # `releases_linux.json` contains zero arm64 entries (verified
      # 2026-05-03 across stable / beta / dev). The official
      # documented install on ARM64 hardware (per
      # https://docs.flutter.dev/get-started/install/linux) is
      # `git clone flutter/flutter` + `flutter precache`, which
      # bootstraps the Dart SDK and fetches per-arch engine artifacts
      # for the host triple. We mirror that path here, pinning to a
      # framework commit SHA (not tag — tags are mutable) so the
      # SDK we run is cryptographically reproducible across reruns.
      - name: Cache Flutter SDK + engine artefacts
        id: flutter-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ${{ runner.temp }}/flutter
          # Cache key carries the full SHA + OS + arch — bumping
          # FLUTTER_SHA below invalidates automatically.
          key: flutter-arm64-${{ runner.os }}-00b0c91f06209d9e4a41f71b7a512d6eb3b9c694

      - name: Install Flutter SDK (git clone)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        env:
          # `git rev-parse 3.41.9` against flutter/flutter — the
          # framework HEAD of the 3.41.9 stable tag. Bump in
          # lockstep with a Flutter version roll.
          FLUTTER_SHA: 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
        run: |
          git -c advice.detachedHead=false clone \
            --filter=blob:none \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_SHA"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux

      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        # Same set as build-linux-x64; `libtss2-dev` is required
        # by tss-esapi for the native TPM2 backend (NI-1).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libtss2-dev lld

      - uses: ./.github/actions/setup-rust

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux ARM64
        run: flutter build linux --release

      - name: Package tar.gz
        # Same reproducible-tar invocation as the x64 path —
        # SOURCE_DATE_EPOCH + sort=name + numeric-owner + gzip -n
        # produce a deterministic stream so two runs at the same
        # commit yield identical sha256.
        run: |
          cd build/linux/arm64/release/bundle
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - . \
            | gzip -n -9 \
            > ${{ github.workspace }}/letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.tar.gz

      - name: Cache appimagetool (aarch64)
        # Separate cache key from x64 — appimagetool ships per-arch
        # binaries; the aarch64 release on the AppImage org repo
        # carries its own sha256 (verified against the upstream
        # 1.9.1 release artefact at workflow-author time).
        id: cache-appimagetool-arm64
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: appimagetool
          key: appimagetool-1.9.1-aarch64-f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158

      - name: Package AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download appimagetool if not cached, then verify hash (even from cache).
          if [ ! -f appimagetool ]; then
            gh release download 1.9.1 --repo AppImage/appimagetool --pattern 'appimagetool-aarch64.AppImage' --output appimagetool
          fi
          echo "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158  appimagetool" | sha256sum -c
          chmod +x appimagetool
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/lib $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/arm64/release/bundle/* $APPDIR/usr/bin/
          cp linux/packaging/letsflutssh.desktop $APPDIR/usr/share/applications/
          cp linux/packaging/letsflutssh.desktop $APPDIR/
          cp assets/icons/icon.png $APPDIR/usr/share/icons/hicolor/256x256/apps/letsflutssh.png
          cp assets/icons/icon.png $APPDIR/letsflutssh.png
          cat > $APPDIR/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/letsflutssh" "$@"
          APPRUN
          chmod +x $APPDIR/AppRun
          ARCH=aarch64 ./appimagetool --no-appstream $APPDIR letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.AppImage

      - name: Package deb
        run: |
          VER=${{ needs.preflight.outputs.version }}
          PKG=letsflutssh_${VER}_arm64
          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/usr/bin
          mkdir -p $PKG/usr/lib/letsflutssh
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/arm64/release/bundle/* $PKG/usr/lib/letsflutssh/
          ln -sf /usr/lib/letsflutssh/letsflutssh $PKG/usr/bin/letsflutssh
          cp linux/packaging/letsflutssh.desktop $PKG/usr/share/applications/
          cp assets/icons/icon.png $PKG/usr/share/icons/hicolor/256x256/apps/letsflutssh.png
          cat > $PKG/DEBIAN/control << EOF
          Package: letsflutssh
          Version: ${VER}
          Architecture: arm64
          Maintainer: LetsFLUTssh <noreply@letsflutssh.dev>
          Description: Lightweight cross-platform SSH/SFTP client
           A full-featured SSH terminal and SFTP file browser with session
           management, encrypted credential storage, and tiling terminal layout.
          Depends: libgtk-3-0, libsecret-1-0, libtss2-esys-3.0.2-0 | libtss2-esys-0
          Section: net
          Priority: optional
          EOF
          dpkg-deb --build $PKG
          mv ${PKG}.deb letsflutssh-${VER}-linux-arm64.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-arm64
          retention-days: 7
          path: |
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.tar.gz
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.AppImage
            letsflutssh-${{ needs.preflight.outputs.version }}-linux-arm64.deb

  build-windows:
    needs: preflight
    # Pinned explicitly to silence the `windows-2025` → `windows-2025-vs2026`
    # redirect notice GitHub fires on `windows-latest` until the May 2026
    # forced migration. Pinned label = reproducible toolchain (VS 2026 +
    # MSVC + Rust). Bump when GitHub deprecates this label.
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # Pin x64 Temurin so the `jni` Flutter plugin links against an
      # x64 `jvm.lib`. The default `JAVA_HOME` on the
      # `windows-2025-vs2026` runner points at an ARM64 Temurin tree
      # (`Java_Temurin-Hotspot_jdk\<ver>\aarch64`), and the `jni`
      # plugin's Windows vcxproj resolves `jvm.lib` through that
      # path — link fails with `LNK4272: library machine type 'ARM64'
      # conflicts with target machine type 'x64'` + an unresolved
      # `__imp_JNI_CreateJavaVM`. `jni` is a transitive dep of
      # `path_provider_android` (Android-only at runtime) but its
      # plugin descriptor declares a Windows build target, so
      # Flutter compiles it on every Windows release. Fix is the
      # explicit x64 architecture pin.
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17
          architecture: x64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pin Flutter version so every x64 job in the release
          # matrix builds against the same SDK, matching the
          # `FLUTTER_SHA` the ARM64 jobs git-clone — bump both
          # together. Sustains build reproducibility across
          # runner-image rotations.
          flutter-version: 3.41.9
          # Disabled, second time. The first round
          # (commit 58de515c) freed ~5 GB of cache budget and
          # let cargokit caches stop getting evicted every CI
          # run; we re-enabled it (02010517) once the per-job
          # cargokit key split (d38c27e6) reduced the cargokit
          # footprint forecast. The math overlooked one thing:
          # the iOS cargokit-cache fix (178ed25e) added a
          # *seventh* cargokit entry under `~/Library/Developer/
          # Xcode/DerivedData` (~541 MB) that wasn't in the
          # forecast, and the per-job split itself gave us a
          # cargokit per platform job rather than per (os, arch)
          # tuple — 6 entries × 300-900 MB instead of the 4 the
          # estimate assumed. Steady state crept back over 10 GB
          # (~10.5 GB measured in run 25371640555), LRU eviction
          # picked off cargokit caches between every run again,
          # and Linux x64 / Windows / Android paid full cold-
          # rebuild cost on each push (Linux 4m → 10m, Windows
          # 9m → 20m, Android 14m → 21m).
          #
          # Disabling Flutter SDK caching here (~5 GB across the
          # 5 platform jobs + their pub-cache siblings) brings
          # the steady-state footprint to ~5 GB and gives the
          # cargokit + rust-cache layers persistent room. Trade
          # ~1 min per job on SDK mirror download (5 jobs ×
          # 1 min ≈ 5 min total CI wallclock cost) against
          # ~10 min per Windows / Android cold rebuild (one
          # platform alone) recovered.
          #
          # Keep `cache: true` in `ci.yml`, `reproducibility-
          # check.yml`, `ci-sonarcloud.yml`. Those are single-
          # platform Linux jobs whose 1.6 GB Flutter SDK cache
          # doesn't push the repo past the limit on its own.
          cache: false

      - uses: ./.github/actions/setup-rust

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Self-signed Authenticode
        # No commercial code-signing cert. Self-sign so Windows at least
        # shows the publisher in the SmartScreen dialog (instead of
        # "Unknown publisher") — users still have to click "More info"
        # → "Run anyway" the first time, but the dialog is less alarming.
        # Certificate is generated fresh per release and discarded; the
        # binary identity that matters is the Ed25519 release signature
        # that the updater verifies (lib/core/update/release_signing.dart).
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=LetsFLUTssh Open Source, O=Llloooggg, C=XX" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)
          $exe = "build\windows\x64\runner\Release\letsflutssh.exe"
          Set-AuthenticodeSignature `
            -FilePath $exe `
            -Certificate $cert `
            -HashAlgorithm SHA256 `
            -TimestampServer http://timestamp.digicert.com
          Get-AuthenticodeSignature $exe

      - name: Package zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package EXE installer
        run: |
          $env:APP_VERSION = "${{ needs.preflight.outputs.version }}"
          $env:OUTPUT_ARCH = "x64"
          $env:BUILD_DIR = "${{ github.workspace }}\build\windows\x64\runner\Release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\packaging\setup.iss
          Move-Item "windows\packaging\Output\letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64-setup.exe" .

      - name: Self-signed Authenticode (installer)
        # Installer inherits its own Authenticode signature — the signing
        # from the previous step only covered letsflutssh.exe inside the
        # build dir; Inno Setup re-wraps it into a separate PE that needs
        # its own signature. Same self-signed cert.
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -like '*LetsFLUTssh Open Source*' } |
            Select-Object -First 1
          $installer = "letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64-setup.exe"
          Set-AuthenticodeSignature `
            -FilePath $installer `
            -Certificate $cert `
            -HashAlgorithm SHA256 `
            -TimestampServer http://timestamp.digicert.com
          Get-AuthenticodeSignature $installer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          retention-days: 7
          path: |
            letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64.zip
            letsflutssh-${{ needs.preflight.outputs.version }}-windows-x64-setup.exe

  build-windows-arm64:
    # Native ARM64 Windows build on the GitHub-hosted
    # `windows-11-arm` runner. Targets Snapdragon X / Surface Pro X
    # devices — a small but growing user base for ARM64 Windows
    # desktop. Native runner over cross-compile from windows-latest
    # for the same reasons as Linux ARM64: no separate target add /
    # linker swap, cargokit picks the host triple naturally, and
    # the Inno Setup + Authenticode flows are unchanged.
    needs: preflight
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # Same git-clone path as build-linux-arm64 (see the long
      # comment there) — Flutter publishes zero Windows ARM64
      # tarballs, the documented install is `git clone` + `flutter
      # precache`. `shell: bash` resolves to Git Bash on the
      # `windows-11-arm` runner, which handles forward / backward
      # slashes uniformly through the underlying Win32 API.
      - name: Cache Flutter SDK + engine artefacts
        id: flutter-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-arm64-${{ runner.os }}-00b0c91f06209d9e4a41f71b7a512d6eb3b9c694

      - name: Install Flutter SDK (git clone)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FLUTTER_SHA: 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
        run: |
          git -c advice.detachedHead=false clone \
            --filter=blob:none \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_SHA"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" precache --windows

      - name: Add Flutter to PATH
        shell: bash
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-rust

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        # Flutter 3.41.9's `flutter build windows` does NOT accept
        # `--target-platform` (that's an Android-build flag); it
        # picks arch automatically from
        # `_operatingSystemUtils.hostPlatform == HostPlatform.
        # windows_arm64`. On `windows-11-arm` we get either:
        #   - native ARM64 — if `flutter precache --windows`
        #     downloaded an ARM64 Dart SDK (Flutter 3.27+ ships
        #     one and uname -m at install time picks it).
        #   - x64-via-Prism — if Flutter pulled the x64 Dart SDK
        #     and ran it through Windows ARM64's x64 emulation
        #     layer, in which case the host self-reports as x64
        #     and we get an x64 binary (still runs on ARM64
        #     hardware via Prism).
        # Either is a valid release artifact; the downstream
        # `Resolve build dir` step picks whichever path Flutter
        # actually used.
        run: flutter build windows --release

      - name: Resolve build dir
        # `flutter build windows` writes to either
        # `build\windows\arm64\runner\Release\` (native ARM64
        # build) or `build\windows\x64\runner\Release\` (x64
        # binary, runs on ARM64 via Prism). Detect which one
        # Flutter actually picked + export `BUILD_DIR` for the
        # signing / packaging steps below.
        shell: bash
        run: |
          if [ -d "build/windows/arm64/runner/Release" ]; then
            printf '%s\n' 'BUILD_DIR=build\windows\arm64\runner\Release' >> "$GITHUB_ENV"
          elif [ -d "build/windows/x64/runner/Release" ]; then
            printf '%s\n' 'BUILD_DIR=build\windows\x64\runner\Release' >> "$GITHUB_ENV"
          else
            echo "::error::Flutter produced no recognised Windows build dir"
            ls -la build/windows/ || true
            exit 1
          fi

      - name: Self-signed Authenticode
        # Same self-sign-then-discard certificate flow as
        # build-windows; the alternative SmartScreen dialog is
        # equally relevant on ARM64 (the Authenticode signature
        # is the property of the publisher identity, not the CPU
        # architecture).
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=LetsFLUTssh Open Source, O=Llloooggg, C=XX" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)
          $exe = "$env:BUILD_DIR\letsflutssh.exe"
          Set-AuthenticodeSignature `
            -FilePath $exe `
            -Certificate $cert `
            -HashAlgorithm SHA256 `
            -TimestampServer http://timestamp.digicert.com
          Get-AuthenticodeSignature $exe

      - name: Package zip
        run: Compress-Archive -Path $env:BUILD_DIR\* -DestinationPath letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64.zip

      - name: Install Inno Setup
        # Inno Setup ships an x86 installer that runs under x64
        # emulation on ARM64 Windows. The installer it produces
        # carries an `ArchitecturesAllowed` clause in
        # `windows/packaging/setup.iss` that determines whether
        # the resulting installer marks itself as ARM64 — see
        # the setup.iss tweak below before this build is
        # declared a first-class shipping channel.
        run: choco install innosetup -y --no-progress

      - name: Package EXE installer
        # `setup.iss` reads `OUTPUT_ARCH` from the env to pick the
        # filename slug (`-windows-arm64-setup.exe` here, `-windows-
        # x64-setup.exe` on the AMD64 job). Inno Setup 6.3+'s
        # `ArchitecturesAllowed=x64compatible` covers both AMD64 and
        # ARM64 hosts, so a single directive in the script handles
        # both runner shapes — no per-arch `#if`.
        run: |
          $env:APP_VERSION = "${{ needs.preflight.outputs.version }}"
          $env:OUTPUT_ARCH = "arm64"
          $env:BUILD_DIR = "${{ github.workspace }}\$env:BUILD_DIR"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\packaging\setup.iss
          Move-Item "windows\packaging\Output\letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64-setup.exe" .

      - name: Self-signed Authenticode (installer)
        # Mirror the build-windows installer-signing step. Inno Setup
        # re-wraps the signed `letsflutssh.exe` into a separate PE
        # that needs its own signature, otherwise SmartScreen flags
        # the installer as "Unknown publisher" even though the
        # bundled binary inside it is signed.
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -like '*LetsFLUTssh Open Source*' } |
            Select-Object -First 1
          $installer = "letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64-setup.exe"
          Set-AuthenticodeSignature `
            -FilePath $installer `
            -Certificate $cert `
            -HashAlgorithm SHA256 `
            -TimestampServer http://timestamp.digicert.com
          Get-AuthenticodeSignature $installer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-arm64
          retention-days: 7
          path: |
            letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64.zip
            letsflutssh-${{ needs.preflight.outputs.version }}-windows-arm64-setup.exe

  build-macos:
    needs: preflight
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pin Flutter version so every x64 job in the release
          # matrix builds against the same SDK, matching the
          # `FLUTTER_SHA` the ARM64 jobs git-clone — bump both
          # together. Sustains build reproducibility across
          # runner-image rotations.
          flutter-version: 3.41.9
          # Disabled, second time. The first round
          # (commit 58de515c) freed ~5 GB of cache budget and
          # let cargokit caches stop getting evicted every CI
          # run; we re-enabled it (02010517) once the per-job
          # cargokit key split (d38c27e6) reduced the cargokit
          # footprint forecast. The math overlooked one thing:
          # the iOS cargokit-cache fix (178ed25e) added a
          # *seventh* cargokit entry under `~/Library/Developer/
          # Xcode/DerivedData` (~541 MB) that wasn't in the
          # forecast, and the per-job split itself gave us a
          # cargokit per platform job rather than per (os, arch)
          # tuple — 6 entries × 300-900 MB instead of the 4 the
          # estimate assumed. Steady state crept back over 10 GB
          # (~10.5 GB measured in run 25371640555), LRU eviction
          # picked off cargokit caches between every run again,
          # and Linux x64 / Windows / Android paid full cold-
          # rebuild cost on each push (Linux 4m → 10m, Windows
          # 9m → 20m, Android 14m → 21m).
          #
          # Disabling Flutter SDK caching here (~5 GB across the
          # 5 platform jobs + their pub-cache siblings) brings
          # the steady-state footprint to ~5 GB and gives the
          # cargokit + rust-cache layers persistent room. Trade
          # ~1 min per job on SDK mirror download (5 jobs ×
          # 1 min ≈ 5 min total CI wallclock cost) against
          # ~10 min per Windows / Android cold rebuild (one
          # platform alone) recovered.
          #
          # Keep `cache: true` in `ci.yml`, `reproducibility-
          # check.yml`, `ci-sonarcloud.yml`. Those are single-
          # platform Linux jobs whose 1.6 GB Flutter SDK cache
          # doesn't push the repo past the limit on its own.
          cache: false

      - uses: ./.github/actions/setup-rust
        # Universal binary — cargokit runs cargo twice (one per
        # arch) and `lipo`s the dylib outputs into a fat binary
        # bundled into the .app's Frameworks dir.
        with:
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS (universal — x64 + arm64)
        run: flutter build macos --release

      - name: Ad-hoc codesign (no Apple Developer ID)
        # Without any signature, Gatekeeper refuses to launch the app
        # on a modern macOS unless the user runs
        # `xattr -dr com.apple.quarantine` every install. Ad-hoc
        # (`codesign --sign -`) produces a locally-valid signature that
        # Gatekeeper accepts via the right-click → Open flow. The app
        # is still marked "Unidentified developer" because we do not
        # carry an Apple-rooted cert — Apple Developer ID is out of
        # scope (no external paid accounts).
        #
        # **`--deep` is required on macOS 26 (Tahoe).** An earlier
        # revision of this step signed every Mach-O + framework + the
        # outer bundle in independent per-file `codesign --sign -`
        # calls, on the theory that `--deep` was deprecated and could
        # silently skip nested items. That layout produced a bundle
        # where every binary carried `Signature=adhoc,
        # TeamIdentifier=not set` — `codesign -dvv` was happy and the
        # CI sanity gate passed — yet dyld rejected the launch with
        # "mapping process and mapped file (non-platform) have
        # different Team IDs" because each per-file signature had an
        # independent Code Directory hash, and Tahoe's dyld cross-
        # references those across the main binary and its embedded
        # frameworks. A single `codesign --force --deep --sign -` on
        # the outer bundle writes one consistent Code Directory chain
        # and the app launches. `--deep` is deprecated for Developer-ID
        # flows (where the skipping bug matters), but for ad-hoc signing
        # it is the only path that produces the identity macOS 26
        # requires. Verified by user-side `sudo codesign --force
        # --deep --sign - /Applications/letsflutssh.app` workaround.
        #
        # **Do NOT pass `--options=runtime`.** Hardened Runtime is
        # designed to pair with a Developer ID signature — pairing it
        # with an ad-hoc sig produces a partially-valid state that
        # macOS 26 dyld rejects at launch (same misleading "different
        # Team IDs" error). The user-side workaround that rescues
        # broken installs omits `--options=runtime`; CI must match the
        # exact flag set that was verified to work.
        run: |
          set -euxo pipefail
          APP="build/macos/Build/Products/Release/letsflutssh.app"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Sanity gate: every Mach-O binary in the bundle must carry an
          # ad-hoc signature. Framework binaries live at
          # `.../$NAME.framework/Versions/A/$NAME` so a `-path
          # '*/MacOS/*'` filter misses them — inspect every file and
          # only assert on Mach-O.
          while IFS= read -r -d '' bin; do
            if [ "$(file -b --mime-type "$bin")" = application/x-mach-binary ]; then
              codesign -dv "$bin" 2>&1 | grep -q 'Signature=adhoc' \
                || { echo "::error::Not ad-hoc signed: $bin"; exit 1; }
            fi
          done < <(find "$APP/Contents" -type f -print0)

      - name: Package tar.gz
        run: |
          # macOS tarball is NOT reproducible — BSD tar on the
          # runner lacks `--sort=name` and `--mtime=@<epoch>`, the
          # .dmg alongside uses hdiutil which bakes in per-run
          # catalog metadata, and the ad-hoc signed binary carries
          # its own deterministic sig but the packaging around it
          # drifts per run. Users who need reproducible verification
          # should cross-check the Linux `.tar.gz` (reproducible)
          # or rebuild locally and compare ad-hoc sigs on the
          # per-binary level. Documented honestly rather than
          # papered over.
          cd build/macos/Build/Products/Release
          tar czf ${{ github.workspace }}/letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.tar.gz ./*.app

      - name: Package dmg
        run: |
          hdiutil create -volname "LetsFLUTssh" -srcfolder build/macos/Build/Products/Release/letsflutssh.app -ov -format UDZO letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-universal
          retention-days: 7
          path: |
            letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.tar.gz
            letsflutssh-${{ needs.preflight.outputs.version }}-macos-universal.dmg

  build-ios-unsigned:
    # Unsigned `.ipa` build — the `.ipa` is published as a release
    # artifact so a user with their own Apple Developer ID (or even
    # a free Apple ID + Xcode for personal-use 7-day signing) can
    # re-sign it locally and install on a device without rebuilding
    # the whole project from source. The job also doubles as
    # iOS-cfg compile validation: a regression that only manifests
    # on `cfg(target_os = "ios")` (e.g. a divergence between the
    # macOS and iOS Apple-stack code paths in `lfs_os_security`) is
    # caught here rather than waiting for an external user to
    # discover it. The `rust-cross-check` matrix in ci.yml already
    # covers `aarch64-apple-ios` for `cargo check` on every PR;
    # this job extends the validation to a full Flutter iOS bundle
    # build that exercises cargokit's iOS xcframework path
    # end-to-end and produces a downloadable artifact.
    needs: preflight
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pin Flutter version so every x64 job in the release
          # matrix builds against the same SDK, matching the
          # `FLUTTER_SHA` the ARM64 jobs git-clone — bump both
          # together. Sustains build reproducibility across
          # runner-image rotations.
          flutter-version: 3.41.9
          # Disabled, second time. The first round
          # (commit 58de515c) freed ~5 GB of cache budget and
          # let cargokit caches stop getting evicted every CI
          # run; we re-enabled it (02010517) once the per-job
          # cargokit key split (d38c27e6) reduced the cargokit
          # footprint forecast. The math overlooked one thing:
          # the iOS cargokit-cache fix (178ed25e) added a
          # *seventh* cargokit entry under `~/Library/Developer/
          # Xcode/DerivedData` (~541 MB) that wasn't in the
          # forecast, and the per-job split itself gave us a
          # cargokit per platform job rather than per (os, arch)
          # tuple — 6 entries × 300-900 MB instead of the 4 the
          # estimate assumed. Steady state crept back over 10 GB
          # (~10.5 GB measured in run 25371640555), LRU eviction
          # picked off cargokit caches between every run again,
          # and Linux x64 / Windows / Android paid full cold-
          # rebuild cost on each push (Linux 4m → 10m, Windows
          # 9m → 20m, Android 14m → 21m).
          #
          # Disabling Flutter SDK caching here (~5 GB across the
          # 5 platform jobs + their pub-cache siblings) brings
          # the steady-state footprint to ~5 GB and gives the
          # cargokit + rust-cache layers persistent room. Trade
          # ~1 min per job on SDK mirror download (5 jobs ×
          # 1 min ≈ 5 min total CI wallclock cost) against
          # ~10 min per Windows / Android cold rebuild (one
          # platform alone) recovered.
          #
          # Keep `cache: true` in `ci.yml`, `reproducibility-
          # check.yml`, `ci-sonarcloud.yml`. Those are single-
          # platform Linux jobs whose 1.6 GB Flutter SDK cache
          # doesn't push the repo past the limit on its own.
          cache: false

      - uses: ./.github/actions/setup-rust
        # `aarch64-apple-ios` for real devices, `*-ios-sim` +
        # `x86_64-apple-ios` for the simulator slice cargokit
        # produces alongside; all three feed into the
        # xcframework bundled in the .app's Frameworks dir.
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Pre-flight cargo build for iOS (surface rustc errors)
        # `flutter build ios` invokes cargokit which invokes cargo
        # under Xcode's stdout filter — rustc diagnostics get
        # collapsed to a single "could not compile $crate (lib)
        # due to N previous errors" line in the GitHub Actions
        # log, without the actual `error[Exxxx]` body. Run cargo
        # directly here first so any iOS-cfg compile regression
        # surfaces with full rustc output before the Xcode wrapper
        # gets a chance to swallow it. Real-device target only —
        # the simulator slices (aarch64-apple-ios-sim,
        # x86_64-apple-ios) tend to share the same iOS-cfg paths,
        # and the device target is what end users actually run.
        #
        # `working-directory: rust` is load-bearing: rustup walks
        # UP from CWD looking for `rust-toolchain.toml`, so cargo
        # invoked from the repo root would pick up the runner's
        # default-stable toolchain — which does NOT have the iOS
        # targets the `setup-rust` composite added to the pinned
        # 1.95.0 toolchain. cd'ing into `rust/` makes rustup find
        # the toml + use 1.95.0, where the targets actually live.
        #
        # `IPHONEOS_DEPLOYMENT_TARGET=13.0` is also load-bearing:
        # without it, the rustc target `aarch64-apple-ios` defaults
        # to iOS 10.0, but vendored OpenSSL (3.6.x) compiles against
        # the current Xcode 15+ SDK headers and emits references to
        # `__chkstk_darwin` — a stack-checking symbol added in iOS
        # 13. Linker fails with "Undefined symbols for architecture
        # arm64: ___chkstk_darwin". The app's Podfile pins
        # `platform :ios, '13.0'` so the production `flutter build
        # ios` step uses iOS 13 already; we just need to mirror it
        # for the standalone cargo invocation here. Matches the
        # README + pubspec iOS requirement.
        working-directory: rust
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: cargo build -p lfs_frb --release --target aarch64-apple-ios

      - name: Build iOS (no codesign)
        # `--no-codesign` skips the provisioning-profile / signing
        # identity requirement so the build runs without an Apple
        # Developer Program account. Output is an unsigned `.app`
        # bundle inside `build/ios/iphoneos/` that the next step
        # repacks into a `.ipa` shape.
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        # Wrap the `.app` bundle in the `Payload/` directory layout
        # iOS expects from a `.ipa`, then zip. The output cannot be
        # installed as-is — iOS rejects unsigned binaries. End users
        # re-sign locally:
        #   unzip letsflutssh-X.Y.Z-ios-unsigned.ipa
        #   codesign -f -s "<Apple ID Developer cert>" \
        #            --entitlements <entitlements.plist> \
        #            Payload/Runner.app
        #   zip -r resigned.ipa Payload/
        # Free Apple ID users can equivalently drop the `.app` into
        # Xcode (Window → Devices & Simulators) which signs + installs
        # with a 7-day personal-team certificate.
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r ${{ github.workspace }}/letsflutssh-${{ needs.preflight.outputs.version }}-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-unsigned
          retention-days: 7
          path: letsflutssh-${{ needs.preflight.outputs.version }}-ios-unsigned.ipa

