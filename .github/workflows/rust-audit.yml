name: Rust Security Audit

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: true

# Weekly RustSec advisory database scan against `rust/Cargo.lock`.
# Complements `ci.yml::rust-ci`'s on-PR `cargo deny check` — that job
# only fires on the dependency-bump PR itself, so a CVE that lands
# in RustSec between PRs sits unnoticed until the next bump arrives.
# This cron narrows that window to one week worst-case.
#
# Same `rust/deny.toml` config as the on-PR job, so a finding here
# means the on-PR gate would also fail — the difference is only when
# the gate runs.

on:
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC — matches `osv.yml`, `codeql.yml`,
    # `scorecard.yml`, `semgrep.yml` so the weekly security
    # cluster lands on the same morning for triage convenience.
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        # rust-toolchain.toml pin is honoured automatically when
        # cargo runs in `working-directory: rust`. The `rustup show`
        # call is just for the audit-trail entry in the run log.
        working-directory: rust
        run: rustup show active-toolchain

      - name: Install cargo-deny
        # Same pinned version as ci.yml::rust-ci so the two paths
        # produce identical findings — diverging versions could
        # mean the weekly cron flags a CVE the on-PR check missed
        # for tooling-version reasons rather than data reasons.
        run: cargo install --locked --version 0.19.4 cargo-deny

      - name: cargo deny check advisories
        # Advisories sub-gate only — license / bans gates are
        # repository-policy concerns that already gate every PR;
        # repeating them weekly would generate noise without
        # catching a different class of bug. The CVE database
        # is the one that gains entries between PRs.
        working-directory: rust
        run: cargo deny check advisories
