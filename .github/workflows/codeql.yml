name: CodeQL

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

permissions: read-all

jobs:
  codeql-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: actions
          config: |
            paths:
              - '.github'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
