name: CI / Auto-Tag

# Dedupe runs per triggering commit, so a re-run of CI on the same SHA
# cancels its own superseded auto-tag run. The key is the triggering
# workflow_run's head SHA (falling back to github.sha for the manual
# dispatch path) — NOT github.ref. On a workflow_run event github.ref
# is always the default branch, so keying on it collapsed every CI
# completion into one group: a burst of unrelated CI runs (e.g. a
# Dependabot PR flood after a merge) then cancelled the legitimate
# main-branch auto-tag before it could create the release tag. Keying
# on the SHA keeps each commit's auto-tag independent.
concurrency:
  group: ci-auto-tag-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

# Triggers after CI completes on main. Reads the version from
# pubspec.yaml and creates an annotated tag if it doesn't exist yet.
#
# Version bumps happen on dev before the PR (dev/scripts/bump-version.sh).
# This workflow only creates tags — it never modifies code.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: read-all

jobs:
  auto-tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    concurrency:
      group: auto-tag-release
      cancel-in-progress: false
    steps:
      - name: Create tag if version is new
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          SHA="$COMMIT_SHA"
          REPO="${{ github.repository }}"

          # Read version from pubspec.yaml at the CI commit
          VER=$(gh api "repos/${REPO}/contents/pubspec.yaml?ref=${SHA}" \
            --jq '.content' | base64 -d | grep '^version:' | sed 's/version: *//;s/+.*//')
          TAG="v${VER}"

          if [ -z "$VER" ]; then
            echo "Could not extract version from pubspec.yaml — skipping"
            exit 0
          fi

          # Skip if tag already exists (idempotent)
          if gh api "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping"
            exit 0
          fi

          echo "Creating tag ${TAG} for commit ${SHA}..."

          # Create annotated tag object
          TAG_SHA=$(gh api "repos/${REPO}/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type="commit" \
            --jq '.sha')

          # Create tag ref
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$TAG_SHA"

          echo "Created tag ${TAG} -> ${SHA}"
