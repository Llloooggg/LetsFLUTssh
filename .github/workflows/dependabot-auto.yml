name: Dependabot

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: dependabot-auto-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: read-all

jobs:
  version-bump:
    # Only pub (Dart) dependency updates — github-actions updates don't affect the shipped app
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/pub/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        id: metadata

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version
        run: |
          # `dev/scripts/bump-version.sh` runs `git commit`, which needs an
          # identity on the runner. Set the dependabot bot's identity
          # so the bump commit is attributed to the same author as the
          # dependency update it rides on top of.
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'

          # Check if already bumped (re-run safety)
          HEAD_MSG=$(git log -1 --format='%s')
          if echo "$HEAD_MSG" | grep -qE '^chore: bump version '; then
            echo "Already bumped — skipping"
            exit 0
          fi

          dev/scripts/bump-version.sh
          git push

  automerge:
    needs: [version-bump]
    # Runs after version-bump (so the bump commit lands before auto-merge
    # is enabled) but is NOT gated on its success: a `version-bump`
    # failure must not strand the PR. `gh pr merge --auto` waits for the
    # required checks on whatever the final head is, so a successful bump
    # is still picked up; a failed bump just means the dep merges without
    # a version bump (it rides the next release).
    #
    # Known issue (defect, not yet fixed here): `version-bump` fails on
    # `dependabot/pub/*` PRs — its checkout with `secrets.RELEASE_TOKEN`
    # can't authenticate ("could not read Username"). RELEASE_TOKEN is
    # present in the Dependabot secret store, so this is a token
    # value/scope/expiry problem to verify in repo settings, not a
    # workflow bug. Decoupling automerge keeps pub deps merging meanwhile.
    if: always() && github.actor == 'dependabot[bot]' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        id: metadata

      - name: Auto-merge patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --auto --merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
