name: Dependabot

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: dependabot-auto-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: read-all

# Classic Dependabot auto-merge: gate on the dependabot[bot] actor, read
# the update-type via fetch-metadata, and enable native auto-merge for
# patch/minor on the default GITHUB_TOKEN — no PAT involved. There is no
# per-PR app-version bump on purpose: bumping would have to push back onto
# the PR branch AND re-trigger the required checks, and only a PAT-
# authenticated push re-triggers them (the default GITHUB_TOKEN
# deliberately does not, to avoid workflow loops). Instead dependency
# updates merge as-is and fold into the next release's bump:
# `dev/scripts/bump-version.sh` (run on the dev → main PR) counts the
# `build(deps)`/`chore(deps)` commits, and `ci-auto-tag` is idempotent on
# the pubspec version — a dep merge that doesn't change the version simply
# doesn't cut its own tag.

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        id: metadata

      - name: Auto-merge patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --auto --merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
