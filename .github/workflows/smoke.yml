name: Smoke

# Build + launch smoke across every shipped platform (iOS via the
# simulator — no signing / Apple Developer account needed). Validates
# that a freshly built artefact actually starts on each OS runtime, the
# layer unit tests can't cover. Heavy, so it does NOT run on every PR:
# manual dispatch + after a release tag. The auto-update apply mechanic
# (AppImage self-replace) is smoke-tested in `make rust-test`
# (lfs_os_security::installer_launch) on every CI run already; this
# workflow covers the per-platform "does the packaged app launch" half.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions: read-all

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build + headless-launch deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libtss2-dev libudev-dev \
            ninja-build libgtk-3-dev xvfb
      - name: Activate Rust toolchain
        working-directory: rust
        run: cargo --version
      - name: Build Linux release
        run: flutter build linux --release
      - name: Launch smoke (headless under xvfb)
        # Start the app under a virtual display; if it is still alive
        # after the warm-up window it cleared engine boot + Rust core
        # init + first frame without crashing. A startup crash exits
        # early and the liveness check fails the job.
        run: |
          BIN=build/linux/x64/release/bundle/letsflutssh
          test -x "$BIN" || { echo "::error::missing $BIN"; exit 1; }
          xvfb-run -a "$BIN" &
          APP=$!
          sleep 20
          if kill -0 "$APP" 2>/dev/null; then
            echo "App alive after 20s — startup smoke passed"
            kill "$APP" 2>/dev/null || true
          else
            echo "::error::App exited during startup"
            wait "$APP" || true
            exit 1
          fi

  windows-desktop:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows release
        run: flutter build windows --release
      - name: Launch smoke
        # Windows runners have a session/display; start the exe, wait,
        # and confirm the process is still running before killing it.
        shell: pwsh
        run: |
          $bin = "build\windows\x64\runner\Release\letsflutssh.exe"
          if (-not (Test-Path $bin)) { Write-Error "missing $bin"; exit 1 }
          $p = Start-Process -FilePath $bin -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Error "App exited during startup (code $($p.ExitCode))"
            exit 1
          }
          Write-Host "App alive after 20s — startup smoke passed"
          Stop-Process -Id $p.Id -Force

  macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS release
        run: flutter build macos --release
      - name: Launch smoke
        # `open -W` would block; launch the bundle binary directly and
        # liveness-check it, mirroring the Linux/Windows jobs. The app is
        # unsigned but locally built (no quarantine xattr), so Gatekeeper
        # does not block a direct exec.
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::no .app built"; exit 1; }
          # Apple Silicon SIGKILLs an unsigned arm64 binary on launch.
          # Ad-hoc sign (no certificate / dev account) so the locally
          # built app runs — this is a launch smoke, not a notarization
          # check.
          codesign --force --deep --sign - "$APP"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$BIN" &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "App alive after 20s — startup smoke passed"
            kill "$PID" 2>/dev/null || true
          else
            echo "::error::App exited during startup"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      # Mirror build-release.yml's build-android setup: the cargokit
      # gradle plugin invokes cargo per ABI to produce liblfs_frb.so, so
      # the Android Rust targets + cargo-ndk must be present, and the Dart
      # codegen must run before the build — without this the Android build
      # resolves a different dependency graph and the Kotlin compile fails.
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked --version 4.1.2 cargo-ndk
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (fat, debug keystore)
        # A single fat apk (no --split-per-abi) carries every ABI incl.
        # the x86_64 the emulator runs, so the install step targets one
        # fixed filename instead of a fragile per-ABI glob.
        # allowDebugRelease falls the signing config back to the debug
        # keystore (app/build.gradle.kts gates every gradle invocation on
        # key.properties otherwise), so no signing secret is needed.
        env:
          ORG_GRADLE_PROJECT_allowDebugRelease: 'true'
        run: flutter build apk --release
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install + launch smoke on emulator
        # Best-effort: the apk BUILD above (which compiles the Kotlin +
        # the cargokit Rust core for every ABI) is the hard gate — that's
        # the code validation. The emulator runtime launch is inherently
        # flaky on CI (device-offline / boot timeouts on the hosted
        # runner), so a launch hiccup must not red the whole smoke;
        # `continue-on-error` keeps it informational. A real
        # FATAL-EXCEPTION crash still surfaces in the log + the ::error
        # annotation.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait until the system is fully booted before driving adb —
            # the action returns once the device is up, but install/launch
            # can still race a not-quite-ready device.
            adb wait-for-device
            timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            APK=build/app/outputs/flutter-apk/app-release.apk
            if [ ! -f "$APK" ]; then
              echo "::error::apk not found at $APK"; ls -la build/app/outputs/flutter-apk/ || true; exit 1
            fi
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.llloooggg.letsflutssh -c android.intent.category.LAUNCHER 1
            sleep 20
            if adb logcat -d | grep -E "FATAL EXCEPTION|ANR in com.llloooggg.letsflutssh"; then
              echo "::error::App crashed on launch"; exit 1
            fi
            echo "No fatal crash after launch — Android smoke passed"

  ios-simulator:
    # iOS smoke needs NO signing / Apple Developer account — a simulator
    # build runs on the iOS runtime unsigned. This is a sim-target build,
    # not the released device .ipa (which would need signing), so it
    # validates "the app launches on iOS" rather than the exact shipped
    # binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build for the iOS simulator (unsigned)
        run: flutter build ios --simulator --debug
      - name: Boot a simulator, install + launch smoke
        run: |
          DEVICE=$(xcrun simctl create smoke-iphone \
            com.apple.CoreSimulator.SimDeviceType.iPhone-15 || true)
          # Fall back to any available iPhone runtime if the named type
          # isn't present on the runner image.
          xcrun simctl boot "${DEVICE:-booted}" || xcrun simctl boot booted || true
          APP=$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::no simulator .app built"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted "$BUNDLE_ID"
          sleep 15
          # `simctl launch` prints the pid; if the process is gone the
          # app crashed on startup.
          if xcrun simctl spawn booted launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App running on the simulator — iOS smoke passed"
          else
            echo "::error::App not running after launch"; exit 1
          fi
