name: Semgrep

# Cancel superseded runs of the same workflow on the same ref. The
# default GitHub behaviour stacks queued runs, which on a busy push
# day for solo-maint repos burns runner minutes verifying SHAs that
# the next push already obsoleted.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

permissions: read-all

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        # `--config auto` pulls language-aware rule packs for every
        # language detected under the scan paths — Dart for lib/ and
        # test/, Rust for rust/ (security/transport core, see
        # ARCHITECTURE.md §3.14). Cargokit is excluded because it is
        # vendored upstream; we only want our own surface scanned.
        run: |
          semgrep scan --config auto \
            --exclude=rust_builder \
            --sarif --sarif-output=semgrep.sarif \
            lib/ test/ rust/

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: semgrep.sarif
