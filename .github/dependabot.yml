version: 2
# Monthly cadence across every ecosystem. The weekly default was too
# noisy for a solo-maintainer repo — PRs landed faster than the merge
# flow could review them and the backlog buried the real breakage.
# Monthly batches still catches security bumps inside an acceptable
# window (GitHub's native security-advisory PRs bypass this schedule
# and ship immediately regardless) while keeping the normal
# bump-PR load at ~1-3 PRs/month total.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    # Group related Dart deps so a coordinated Riverpod / Drift
    # / Flutter SDK release lands as one PR instead of N split
    # bumps that each trigger a fresh CI run + per-PR review.
    groups:
      flutter-tooling:
        patterns:
          - "flutter_*"
          - "build_runner*"
          - "freezed*"
          - "json_serializable*"
          - "json_annotation*"
      riverpod:
        patterns:
          - "*riverpod*"
      drift:
        patterns:
          - "drift*"
          - "sqlite3*"
      crypto-stack:
        patterns:
          - "cryptography*"
          - "pointycastle"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-core:
        patterns:
          - "actions/*"
          - "github/*"
  # Rust security/transport core under rust/. Bumps crossing a russh
  # major (e.g. 0.59 → 0.60) need manual review — currently blocked on
  # the upstream RustCrypto release-candidate set (pkcs8 0.11 RC).
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "monthly"
    groups:
      tokio-stack:
        patterns:
          - "tokio*"
          - "futures*"
          - "async-*"
      russh-stack:
        patterns:
          - "russh*"
          - "ssh-*"
      rustcrypto:
        patterns:
          - "aes*"
          - "ahash"
          - "argon2"
          - "blake3"
          - "chacha20*"
          - "digest*"
          - "hmac"
          - "p256"
          - "rsa"
          - "rand*"
          - "rust-crypto"
          - "sha2*"
          - "subtle"
          - "x25519*"
          - "zeroize*"
      reqwest-stack:
        patterns:
          - "reqwest*"
          - "rustls*"
          - "hyper*"
