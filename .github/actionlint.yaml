# actionlint configuration.
#
# Per-path ignore regexes for known non-issues. Keep entries narrow so
# real problems still surface — broad rule disables would defeat the
# point of running actionlint at all.

# GitHub-hosted runner labels actionlint's bundled metadata does not
# yet recognise. These are real labels offered by GitHub Actions
# (typically newer additions); whitelisting them here lets the
# release-build job target them without `runner-label` warnings.
self-hosted-runner:
  labels:
    # Native ARM64 Linux runner — used by build-linux-arm64 in
    # build-release.yml for the Wave 5a Linux ARM64 channel.
    - ubuntu-24.04-arm
    # Native ARM64 Windows runner — used by build-windows-arm64
    # in build-release.yml for the Wave 5b Windows ARM64 channel.
    - windows-11-arm
    # Windows 2025 + VS 2026 image — preview runner used by the
    # Rust cross-check + release-build jobs to pin the toolchain
    # ahead of GitHub's general-availability rotation. The label
    # is a real GitHub-hosted runner; actionlint 1.7.5's bundled
    # metadata predates its publication.
    - windows-2025-vs2026

paths:
  .github/workflows/**/*.yml:
    ignore:
      # SonarSource scan-action: actionlint's metadata flags
      # `with.args` as a no-context field, but the action genuinely
      # evaluates `${{ ... }}` there (CI runs prove it).
      - 'context "[a-z]+" is not allowed here. no context is available here'
      # SC2012 (`ls -t sha256*.jsonl | head -1`) — info-level
      # suggestion to use `find`. We control the filename pattern;
      # `find` would only obscure the intent.
      - 'shellcheck reported issue in this script: SC2012:'
      # SC2129 (multiple `>> $GITHUB_OUTPUT` redirects) — style
      # suggestion to group with `{ ...; } >> file`. Reads worse for
      # GHA output assignments, no functional difference.
      - 'shellcheck reported issue in this script: SC2129:'
